<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid V8 · M8.5.8 HD Faucet</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5;max-width:84vw}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID V8 · M8.5.8</b><small>loading M8.5.7.1 faucet · adaptive HD SSFR 60–68% · mobile-safe fallback…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const q=new URLSearchParams(location.search);
    const forced={
      quality:'high',particles:'12500',spacing:'0.023',box:'1.10 1.50 0.74',bodies:'0',bodyphases:'0',
      substeps:'2',iters:'3',xsph:'0.052',scorr:'0.031',tension:'0.074',
      ssfrscale:'0.60',ssfrfilter:'1',ssfriters:'2',ssfrthickblur:'7',ssfrradius:'1.22',
      timing:'0',force:'0',grab:'0'
    };
    for(const [k,v] of Object.entries(forced))q.set(k,v);
    history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);

    const r=await fetch('./m830.html?m858base=1',{cache:'no-store'});
    if(!r.ok)throw new Error(`M8.3 shell fetch failed: HTTP ${r.status}`);
    let html=await r.text();
    const sceneLine=" note.textContent='loading Pool + Dam Break seeds…';await import('./src/v5-scenes-only-m743.js');";
    if(!html.includes(sceneLine))throw new Error('M8.5.8 bootstrap could not locate static scene import.');

    for(const line of [
      " note.textContent='loading physical Wave Lab…';await import('./src/v5-wave-lab-m745.js');",
      " note.textContent='loading coherent source/flow scenarios…';await import('./src/v5-physical-scenes-m752.js');",
      " note.textContent='loading refined fountain and whirlpool…';await import('./src/v5-scaled-scenes-m754.js');",
      " note.textContent='restoring realism controls…';await import('./src/v5-realism-shader-m746.js');",
      " note.textContent='restoring water materials…';await import('./src/v5-water-appearance-m747.js');",
      " note.textContent='restoring clear pool tiles…';await import('./src/v5-pool-material-m748.js');",
      " note.textContent='restoring neutral HDR reflections…';await import('./src/v5-pool-environment-m749.js');",
      " note.textContent='installing M8.2 iterative divergence + adaptive CFL…';await import('./src/v5-fluid-core-m820.js');",
      " note.textContent='installing fine sparse spray…';await import('./src/v5-splash-render-m802.js');",
      " note.textContent='installing ripples, caustics, foam and bubbles…';await import('./src/v5-whitewater-optics-m820.js');",
      " note.textContent='installing M8.3 scenario compatibility layer…';await import('./src/v5-scenes-m830.js');"
    ])html=html.replace(line,'');

    html=html.replace(sceneLine,sceneLine+"\n note.textContent='installing M8.5.2 laminar inlet…';await import('./src/v5-faucet-fast-m852.js');\n await import('./src/v5-fps-hud-m852.js');\n await import('./src/v5-mobile-hud-m857.js');\n note.textContent='restoring M8.5.3 high-fast camera/render profile…';await import('./src/v5-faucet-high-m853.js');\n note.textContent='applying M8.5.5 gentle continuity tune…';await import('./src/v5-faucet-gentle-m855.js');\n note.textContent='applying M8.5.6 conservative coherence tune…';await import('./src/v5-faucet-cohesion-m856.js');\n note.textContent='applying M8.5.7 higher-resolution profile…';await import('./src/v5-faucet-quality-m857.js');\n note.textContent='enabling M8.5.8 adaptive HD surface…';await import('./src/v5-faucet-hd-m858.js');");
    html=html.replace("const scene=s?.active||'pool';","const scene=window.__v5M852Faucet?.active||'faucet';");
    html=html.replaceAll('M8.3','M8.5.8')
      .replace("window.__fluidV5Version='8.5.8.0'","window.__fluidV5Version='8.5.8'")
      .replace("window.__fluidV5Build='M8.5.8 FULL SCENARIO RESTORE / M8.2 COMMON WATER / ONE-SUBMIT CORE'","window.__fluidV5Build='M8.5.8 HD SURFACE / 12.5K / 23MM / ADAPTIVE 48-68% SSFR'");
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('[M8.5.8 bootstrap]',err);boot.className='err';boot.textContent='M8.5.8 BOOTSTRAP ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');
  }
})();
</script></body></html>
