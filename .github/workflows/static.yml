# Deploy production plus isolated renderer/lighting previews.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "three-r185-migration", "shadow-v11-experiment", "rift-lighting-v20-experiment"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main

      # Production Rift now uses the same pre-parse r185 import-map behavior as
      # the known-good /r185-build/r185-test.html preview. Safari freezes native
      # import-map resolution once module parsing starts, so make the production
      # document r185 before Pages publishes it instead of relying on a late
      # runtime import-map swap.
      - name: Promote known-good r185 runtime to production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("three@0.182.0", "three@0.185.1")
          marker = '<script>window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="r185-known-good-v10";</script>'
          if marker not in html:
              html = html.replace("</head>", marker + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      # Keep the exact migration branch available as a frozen rollback/reference
      # preview even though its Rift subtree is now the production baseline.
      - name: Checkout r185 migration preview
        uses: actions/checkout@v4
        with:
          ref: three-r185-migration
          path: .r185-preview-source

      - name: Stage r185 preview
        shell: bash
        run: |
          rm -rf r185-build
          mkdir -p r185-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .r185-preview-source/ r185-build/
          rm -rf .r185-preview-source

      - name: Checkout shadow v11 experiment
        uses: actions/checkout@v4
        with:
          ref: shadow-v11-experiment
          path: .shadow-v11-preview-source

      - name: Stage shadow v11 experiment
        shell: bash
        run: |
          rm -rf shadow-v11-build
          mkdir -p shadow-v11-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .shadow-v11-preview-source/ shadow-v11-build/
          rm -rf .shadow-v11-preview-source

      - name: Checkout Rift Lighting 2.0 experiment
        uses: actions/checkout@v4
        with:
          ref: rift-lighting-v20-experiment
          path: .lighting-v20-preview-source

      - name: Stage Rift Lighting 2.0 experiment
        shell: bash
        run: |
          rm -rf lighting-v20-build
          mkdir -p lighting-v20-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .lighting-v20-preview-source/ lighting-v20-build/
          rm -rf .lighting-v20-preview-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
