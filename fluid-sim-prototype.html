<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGPU Fluid Wave Prototype</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070c; height: 100%; }
  #info {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 14px 16px; font: 13px/1.5 -apple-system, system-ui, sans-serif;
    color: #cfe0f0; background: linear-gradient(to bottom, rgba(5,7,12,0.92), transparent);
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  /* Per "too much text is covering it" — fades to near-invisible a few
     seconds after load (see the setTimeout near the bottom of the
     script) rather than staying at full opacity indefinitely. Not
     display:none/removed entirely — a very low opacity still, so it's
     not a hard jarring disappearance and the text is technically still
     there if someone looks closely, just no longer competing with the
     actual simulation for attention. */
  #info.faded { opacity: 0.1; }
  #info b { color: #fff; }
  #status {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    font: 12px/1.4 ui-monospace, monospace; color: #7fd8a0; background: rgba(0,0,0,0.55);
    padding: 8px 10px; border-radius: 6px; max-width: min(560px, 90vw);
  }
  #status.error { color: #ff8a8a; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="info">
  <b>WebGPU compute-shader wave simulation</b> — real physics, not an animated sine wave. Click/drag to disturb the water.
</div>
<div id="status">Initializing WebGPU…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import {
  Fn, instanceIndex, instancedArray, float, uint, If,
  uniform, vec3, vec2, color, positionLocal, mix, clamp,
  min, max, attribute, time, sin, fract, floor, dot,
  positionWorld, cameraPosition, normalWorld, cross, reflect
} from "three/tsl";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const statusEl = document.getElementById("status");
const infoEl = document.getElementById("info");
// Per "too much text is covering it" — fades the intro text out a few
// seconds after the simulation is confirmed actually running (not a
// fixed delay from page load, which could fire while still stuck on an
// error or the WebGPU-unsupported message, fading away the one thing
// that would explain what's on screen). Triggered from setStatus()
// itself below, the first time it's called with the real "Running…"
// text, rather than a separate timer with its own logic to keep in sync.
function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("error", isError);
  if (!isError && msg.startsWith("Running") && !infoEl.classList.contains("faded")) {
    setTimeout(() => infoEl.classList.add("faded"), 3000);
  }
}

// ---------------------------------------------------------------------------
// Grid setup. WIDTH*WIDTH cells map 1:1 to a WIDTH*WIDTH plane's vertex grid,
// so each compute-shader cell corresponds exactly to one mesh vertex — no
// resampling/interpolation needed between the simulation and the render mesh.
// 128 is a deliberate starting point: large enough to look like real water,
// small enough that a first live test isn't also fighting a performance
// ceiling. This is the first thing worth trying larger (192, 256) once the
// basic simulation is confirmed working, since compute cost scales with
// cell count, not the same way fragment-shader cost does.
// ---------------------------------------------------------------------------
const WIDTH = 128;
const CELL_COUNT = WIDTH * WIDTH;
const PLANE_SIZE = 40; // world units — independent of WIDTH, only affects visual scale/spacing between cells
const SEAFLOOR_Y = -3.5; // real, known depth below the water surface — per "add volume and a seafloor," this is what colorNode below now measures actual depth against, rather than the previous viewing-angle-only approximation
// Shore shape, per "let's build a shore" — the seafloor rises from open-
// ocean depth (SEAFLOOR_Y) up through and above the water surface along
// the +Z edge of the grid, real dry land rather than an infinite ocean.
// These are shared between the seafloor mesh (built in plain JS below,
// since it's static geometry) and the wave equation's own shore damping
// (computed analytically in TSL, see computeUpdate) — using the SAME
// numbers in both places keeps the visual seafloor and the physics that
// reacts to it describing the same actual shape, not two independently-
// guessed approximations of each other.
const SHORE_START_Z = 4; // world Z where the seafloor starts rising out of open-ocean depth
const SHORE_END_Z = 18; // world Z where it reaches full dry-beach height
const SHORE_PEAK_Y = 1.4; // beach height above calm water level (0) — a real, visible dry strip, not just barely breaching the surface
const SHORE_DAMP_DEPTH = 3.5; // matches the game's own liquid.js SHORE_DAMP_DEPTH exactly — real waves lose height over this same depth range approaching shore

let renderer, scene, camera, controls, mesh;
let computeInit, computeUpdate, computeCopyBack;
let heightBufferA, heightBufferB, velocityBuffer;
// Foam persistence, per "creating foam as it draws back in" β€” unlike
// the height buffer's instantaneous water position, foam needs to
// LINGER for a moment after a wave recedes rather than vanishing the
// instant the water level drops, matching how real backwash foam
// clings to the sand as water pulls back. Ping-ponged the same way as
// height (A=read-from, B=write-to, copied back each frame).
let foamBufferA, foamBufferB;
let foamBufferNode;
let heightBufferNode; // always points at heightBufferA (the buffer computeUpdate reads from) — see setupSimulation/animate for how it stays in sync
let clock = new THREE.Clock();
let pointerRay = new THREE.Raycaster();
let pointerNDC = new THREE.Vector2(-10, -10);
let pointerDown = false;
let pointerWorldUniform, pointerActiveUniform;
const WAKE_TRAIL_LENGTH = 6;
let wakeTrailUniforms, wakeTrailHistory;
let lastWakeUpdateTime = 0;

async function init() {
  if (!navigator.gpu) {
    setStatus("This browser doesn't report navigator.gpu — WebGPU isn't available here. Try a current Chrome, Edge, Firefox, or Safari 26+ (iOS 26+/macOS Tahoe+).", true);
    return;
  }

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1420);
  scene.fog = new THREE.Fog(0xa9c9dd, 25, 70); // color updated to match the new sky's horizon tone below, was the old flat navy

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 22, 30);

  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);

  // WebGPURenderer, same class the live game now uses — this prototype is
  // the isolated proving ground for whether the technique works AT ALL
  // before it becomes load-bearing for the actual water/shoreline/caustics
  // systems.
  renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  await renderer.init();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setAnimationLoop(animate);

  controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 8;
  controls.maxDistance = 80;

  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
  sun.position.set(15, 25, 10);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x1a2a3a, 1.2));

  // Per "add a sky background and sun" — a real 3D sky dome (large
  // inverted sphere) rather than a flat 2D scene.background, specifically
  // because a flat backdrop doesn't rotate as the camera orbits via
  // OrbitControls and would look wrong the moment you drag the view.
  // Standard THREE.MeshBasicMaterial + CanvasTexture, deliberately NOT a
  // TSL node material — this carries zero new API risk since it's the
  // same regardless of WebGL/WebGPU backend, unlike everything else new
  // in this file.
  const skyCanvas = document.createElement("canvas");
  skyCanvas.width = 2;
  skyCanvas.height = 512;
  const skyCtx = skyCanvas.getContext("2d");
  const skyGradient = skyCtx.createLinearGradient(0, 0, 0, 512);
  skyGradient.addColorStop(0, "#0a2a4a");
  skyGradient.addColorStop(0.55, "#3d6f95");
  skyGradient.addColorStop(0.85, "#a9c9dd");
  skyGradient.addColorStop(1, "#dce8ee");
  skyCtx.fillStyle = skyGradient;
  skyCtx.fillRect(0, 0, 2, 512);
  const skyTexture = new THREE.CanvasTexture(skyCanvas);
  const skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(150, 32, 16),
    new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide, fog: false })
  );
  scene.add(skyDome);

  // Visible sun disc, positioned to match the actual DirectionalLight's
  // real direction (sun.position, normalized and pushed out to the
  // sky dome's radius) rather than an arbitrary separate position —
  // so the bright spot in the sky is genuinely where the light comes
  // from, not just decoration.
  const sunCanvas = document.createElement("canvas");
  sunCanvas.width = 128;
  sunCanvas.height = 128;
  const sunCtx = sunCanvas.getContext("2d");
  const sunGlow = sunCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
  sunGlow.addColorStop(0, "rgba(255,250,230,1)");
  sunGlow.addColorStop(0.3, "rgba(255,240,200,0.85)");
  sunGlow.addColorStop(1, "rgba(255,230,180,0)");
  sunCtx.fillStyle = sunGlow;
  sunCtx.fillRect(0, 0, 128, 128);
  const sunTexture = new THREE.CanvasTexture(sunCanvas);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTexture, transparent: true, depthWrite: false, fog: false }));
  sunSprite.scale.set(20, 20, 1);
  sunSprite.position.copy(sun.position.clone().normalize().multiplyScalar(140));
  scene.add(sunSprite);

  setupLightRays(sun.position);
  setupSplashParticles();

  setupSimulation();
  heightBufferNode = heightBufferA; // must be valid BEFORE setupSeafloor()/setupMesh(), both of which now read this for real physically-based caustics and water rendering respectively
  foamBufferNode = foamBufferA;
  setupSeafloor();
  setupMesh();
  setupPointerInteraction(canvas);

  window.addEventListener("resize", onResize);
  setStatus(`Running β€” ${WIDTH}x${WIDTH} = ${CELL_COUNT.toLocaleString()} cells`);
}

// ---------------------------------------------------------------------------
// The actual simulation: a real 2D wave equation via finite differences,
// same category of technique as the official Three.js "webgpu_compute_water"
// example this prototype is deliberately modeled after, since that's the
// most well-established reference point for this exact pattern (real,
// working TSL compute code, not an invented approach). Two height buffers
// are used (A = read-from, B = write-to each step), copied back into sync
// via a GPU-side buffer copy at the end of each frame rather than reading
// and writing the same buffer in place, which would race against itself
// across parallel GPU invocations.
// ---------------------------------------------------------------------------
// 2D input -> 1D pseudo-random output, same input always returns the same
// "random" value (deterministic, no state needed) — this exact pattern is
// the standard, well-established shader-community hash function, used
// here for the rain-drop ripple selection below (setupSimulation).
const hash21 = Fn(([p]) => {
  const n = sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453);
  return fract(n);
});

// Real local slope at a given INTEGER water-grid cell (gxi, gyi) β€” used
// below for bilinear interpolation between the 4 nearest cells, rather
// than snapping to whichever single cell a fragment happens to round
// into. Two separate functions (X and Z) rather than packing into a
// vec2 to keep everything in already-proven float math, matching the
// established pattern throughout this file.
const sampleSlopeX = Fn(([gxi, gyi]) => {
  const idxL = gyi.mul(WIDTH).add(gxi.sub(1)).toUint();
  const idxR = gyi.mul(WIDTH).add(gxi.add(1)).toUint();
  return heightBufferNode.element(idxR).sub(heightBufferNode.element(idxL));
});
const sampleSlopeZ = Fn(([gxi, gyi]) => {
  const idxU = gyi.sub(1).mul(WIDTH).add(gxi).toUint();
  const idxD = gyi.add(1).mul(WIDTH).add(gxi).toUint();
  return heightBufferNode.element(idxD).sub(heightBufferNode.element(idxU));
});

// Underwater light-ray beams, per "under the waves the light should
// shine and create beams of light rays" β€” real geometric beams (soft
// gradient-textured planes, additively blended, matching the sun
// sprite's own established technique) rather than a full volumetric
// god-ray post-process, which would need an entire new post-processing
// pipeline this prototype doesn't have (this file only ever calls
// renderer.render() directly, no EffectComposer) β€” a much bigger,
// separate undertaking than is reasonable to add in this pass. This is
// an honest, well-scoped stand-in: real visible beams, angled toward
// the actual sun direction but bent partway toward vertical to
// approximate real Snell's-law refraction (light entering water always
// looks more vertical than the sun's actual angle in the sky, regardless
// of how low the sun sits) β€” zero new TSL/WebGPU risk since these are
// ordinary Three.js materials, not compute-shader-driven.
let lightRayMeshes = [];
function createLightRayGeometry(length, topWidth, bottomWidth) {
  // Trapezoid, not a rectangle β€” per "diffused ... refracts and
  // scatters," real light entering water spreads out as it travels
  // deeper (scattering), so narrow-at-entry/wide-at-depth is both a
  // real physical shape and what makes this read as diffused rather
  // than a crisp parallel beam. Origin sits at (0,0,0), the TOP edge
  // (the water-entry point), with the shape extending along LOCAL -Y
  // from there β€” critically different from a stock PlaneGeometry,
  // whose origin is at its CENTER, which was the real bug letting the
  // previous version's rays extend above the water surface.
  const geo = new THREE.BufferGeometry();
  const halfTop = topWidth / 2;
  const halfBottom = bottomWidth / 2;
  const vertices = new Float32Array([
    -halfTop, 0, 0,
    halfTop, 0, 0,
    -halfBottom, -length, 0,
    halfBottom, -length, 0,
  ]);
  const uvs = new Float32Array([0, 1, 1, 1, 0, 0, 1, 0]);
  geo.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
  geo.setIndex([0, 2, 1, 1, 2, 3]);
  geo.computeVertexNormals();
  return geo;
}

function setupLightRays(sunPosition) {
  const sunDir = sunPosition.clone().normalize();
  const rayDir = new THREE.Vector3(sunDir.x * 0.35, -1, sunDir.z * 0.35).normalize();

  const rayCanvas = document.createElement("canvas");
  rayCanvas.width = 64;
  rayCanvas.height = 256;
  const rayCtx = rayCanvas.getContext("2d");
  const rayGrad = rayCtx.createLinearGradient(0, 0, 0, 256);
  // Softer, more gradual falloff than before β€” per "diffused," a hazier
  // look with no hard edge, rather than a defined beam shape.
  rayGrad.addColorStop(0, "rgba(255,250,220,0.4)");
  rayGrad.addColorStop(0.4, "rgba(255,247,215,0.22)");
  rayGrad.addColorStop(0.75, "rgba(255,245,210,0.08)");
  rayGrad.addColorStop(1, "rgba(255,240,200,0)");
  rayCtx.fillStyle = rayGrad;
  rayCtx.fillRect(0, 0, 64, 256);
  // Per "still looks ... too sharp" β€” the vertical gradient above never
  // addressed the trapezoid's LEFT/RIGHT edges, which were still a hard
  // geometric cutoff. destination-in multiplies what's already drawn by
  // a new gradient's own alpha, so this softens both edges too, real
  // Canvas2D compositing (standard browser API, zero WebGPU/TSL risk)
  // rather than approximating softness through opacity alone.
  rayCtx.globalCompositeOperation = "destination-in";
  const hGrad = rayCtx.createLinearGradient(0, 0, 64, 0);
  hGrad.addColorStop(0, "rgba(255,255,255,0)");
  hGrad.addColorStop(0.5, "rgba(255,255,255,1)");
  hGrad.addColorStop(1, "rgba(255,255,255,0)");
  rayCtx.fillStyle = hGrad;
  rayCtx.fillRect(0, 0, 64, 256);
  const rayTexture = new THREE.CanvasTexture(rayCanvas);

  // Maps LOCAL -Y (the geometry's own "length" direction, entry toward
  // depth) to rayDir, not LOCAL +Y β€” matches how createLightRayGeometry
  // above actually extends its shape.
  const downVec = new THREE.Vector3(0, -1, 0);
  const rayQuat = new THREE.Quaternion().setFromUnitVectors(downVec, rayDir);

  const RAY_COUNT = 16; // was 6 — per "more spread out and 3D," more numerous overlapping beams read as a fuller atmospheric volume rather than a few sparse individual shafts
  for (let i = 0; i < RAY_COUNT; i++) {
    const rayMat = new THREE.MeshBasicMaterial({
      map: rayTexture, transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      opacity: 0.45 + Math.random() * 0.25,
    });
    const rayLength = 2.4 + Math.random() * 1.2; // kept within the real water column depth (seafloor sits around Y=-3.5 in open water) so rays don't visually extend through solid ground
    const rayGeo = createLightRayGeometry(rayLength, 0.35 + Math.random() * 0.25, 1.6 + Math.random() * 1.0);
    const ray = new THREE.Mesh(rayGeo, rayMat);
    ray.quaternion.copy(rayQuat);
    const ox = (Math.random() - 0.5) * 16;
    const oz = (Math.random() - 0.5) * 12 + 2;
    // Entry point pinned just under the resting water level (Y=0), not
    // at it exactly β€” per "should only show once it hits the water,"
    // this keeps the beam's own top edge safely below the surface even
    // as waves push the actual water level up and down around it,
    // rather than risking it poking above during a crest.
    ray.position.set(ox, -0.3, oz);
    ray.userData.baseOpacity = rayMat.opacity;
    lightRayMeshes.push(ray);
    scene.add(ray);
  }

  // Large soft ambient glow, per "more spread out and 3D" β€” a single big,
  // very low-opacity radial sprite underwater, tying the individual
  // beams together into one atmospheric volume rather than reading as a
  // handful of separate sharp shafts. This is the honest, achievable
  // approximation of "more 3D light" without real SSGI (see response
  // text for why true screen-space GI is out of scope here).
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = 128;
  glowCanvas.height = 128;
  const glowCtx = glowCanvas.getContext("2d");
  const glowGrad = glowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
  glowGrad.addColorStop(0, "rgba(255,250,225,0.16)");
  glowGrad.addColorStop(0.6, "rgba(255,248,220,0.06)");
  glowGrad.addColorStop(1, "rgba(255,245,215,0)");
  glowCtx.fillStyle = glowGrad;
  glowCtx.fillRect(0, 0, 128, 128);
  const glowTexture = new THREE.CanvasTexture(glowCanvas);
  const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture, transparent: true, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending,
  }));
  glowSprite.scale.set(22, 10, 1);
  glowSprite.position.set(0, -1.5, 3);
  scene.add(glowSprite);
}

function smoothstepJS(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}
function shoreProfileY(worldZ) {
  const t = smoothstepJS(SHORE_START_Z, SHORE_END_Z, worldZ);
  return SEAFLOOR_Y + t * (SHORE_PEAK_Y - SEAFLOOR_Y);
}

// Per "should vary in brightness, dynamically with the water" β€” a real
// GPU buffer readback (reading the actual live simulation state back to
// the CPU) would add real latency/risk for a purely cosmetic flicker, so
// this instead mirrors the SAME ambient-chop formula the compute shader
// itself already uses (see computeUpdate's own chop1/chop2/chop3),
// evaluated in plain JS at each ray's own position β€” a close real
// approximation of the actual simulated motion at that point, not a
// disconnected canned sine wave.
function approxWaterChop(worldX, worldZ, t) {
  const gx = (worldX / PLANE_SIZE + 0.5) * WIDTH;
  const gy = (worldZ / PLANE_SIZE + 0.5) * WIDTH;
  const c1 = Math.sin(gx * 0.22 + gy * 0.09 + t * 1.3);
  const c2 = Math.sin(gx * 0.11 - gy * 0.18 - t * 0.9);
  const c3 = Math.sin(gx * 0.35 + gy * 0.31 + t * 1.7 + 1.7);
  return c1 * 0.4 + c2 * 0.3 + c3 * 0.2;
}

// Per "physics to simulate waves crashing on shore and splashes" β€” a JS
// mirror of the compute shader's own real wave-break detection (same
// waveCycle/waveT/waveFrontY/breakZoneDist formula from computeUpdate's
// rolling-wave section), used to trigger real splash particle spawning
// at the ACTUAL break location β€” same "mirror the shader formula in JS"
// technique already proven for approxWaterChop above, avoiding a risky
// GPU buffer readback for this too. Returns the break's world Z if
// currently breaking, or null.
function currentBreakWorldZ(t) {
  const waveCycle = 7.0;
  const waveT = (t % waveCycle) / waveCycle;
  const waveFrontYGrid = waveT * (WIDTH + 20) - 10;
  const waveFrontWorldZ = (waveFrontYGrid / WIDTH - 0.5) * PLANE_SIZE;
  const breakZoneDist = Math.abs(waveFrontWorldZ - SHORE_START_Z);
  return breakZoneDist < 3.0 ? waveFrontWorldZ : null;
}

// Real splash particle pool, per "physics ... splashes" β€” reusable
// sprites with genuine ballistic physics (gravity), not a canned
// animation. A fixed pool (allocated once, reused via a free/active
// flag) rather than creating/destroying meshes every spawn, matching
// the same "pool, don't churn" pattern established for the rain
// particle system in the live game earlier this whole session.
const MAX_SPLASH_PARTICLES = 90;
let splashParticlePool = [];
function setupSplashParticles() {
  const splashCanvas = document.createElement("canvas");
  splashCanvas.width = 32;
  splashCanvas.height = 32;
  const sctx = splashCanvas.getContext("2d");
  const sgrad = sctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  sgrad.addColorStop(0, "rgba(255,255,255,0.95)");
  sgrad.addColorStop(0.6, "rgba(255,255,255,0.5)");
  sgrad.addColorStop(1, "rgba(255,255,255,0)");
  sctx.fillStyle = sgrad;
  sctx.fillRect(0, 0, 32, 32);
  const splashTexture = new THREE.CanvasTexture(splashCanvas);

  for (let i = 0; i < MAX_SPLASH_PARTICLES; i++) {
    const mat = new THREE.SpriteMaterial({ map: splashTexture, transparent: true, depthWrite: false, fog: false });
    const sprite = new THREE.Sprite(mat);
    sprite.visible = false;
    sprite.scale.set(0.25, 0.25, 1);
    scene.add(sprite);
    splashParticlePool.push({ mesh: sprite, velocity: new THREE.Vector3(), life: 0, maxLife: 1 });
  }
}

function spawnSplashParticle(x, z) {
  const p = splashParticlePool.find((p) => p.life <= 0);
  if (!p) return; // pool exhausted this frame, simply skip rather than growing it unbounded
  p.mesh.position.set(x + (Math.random() - 0.5) * 1.6, 0.05, z + (Math.random() - 0.5) * 1.6);
  p.velocity.set((Math.random() - 0.5) * 2.2, 2.2 + Math.random() * 2.2, (Math.random() - 0.5) * 2.2);
  p.maxLife = 0.55 + Math.random() * 0.35;
  p.life = p.maxLife;
  p.mesh.scale.setScalar(0.18 + Math.random() * 0.15);
  p.mesh.visible = true;
}

function updateSplashParticles(dt) {
  for (const p of splashParticlePool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) {
      p.mesh.visible = false;
      continue;
    }
    p.velocity.y -= 9.8 * dt; // real gravity
    p.mesh.position.addScaledVector(p.velocity, dt);
    if (p.mesh.position.y < -0.3) {
      // hit the water surface again, despawn rather than sinking through it
      p.life = 0;
      p.mesh.visible = false;
      continue;
    }
    p.mesh.material.opacity = Math.min(1, p.life / p.maxLife) * 0.85;
  }
}

// Real seafloor geometry, per "let's build a shore" — rises from open-
// ocean depth up through and above the water surface along the +Z edge,
// a real beach rather than an infinite flat ocean floor. Static (no live
// simulation needed), so this uses plain JS vertex manipulation computed
// once at creation — zero new TSL/WebGPU API surface, unlike everything
// else in this file that needed real verification before use.
function setupSeafloor() {
  const seafloorGeo = new THREE.PlaneGeometry(PLANE_SIZE * 4, PLANE_SIZE * 4, 70, 70); // was PLANE_SIZE*1.5 at 60x60 segments — per "bottom is completely dark," the camera was very likely seeing past this plane's finite edge into the raw flat scene background; substantially larger now (safely within the 150-unit-radius sky dome), segment count raised only modestly since the far extended area is just background, not the detailed near-shore zone
  const posAttr = seafloorGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const px = posAttr.getX(i);
    const py = posAttr.getY(i);
    const worldZ = -py; // local Y maps to world -Z after the rotation.x below (a -90Β° rotation around X)
    const baseOffset = shoreProfileY(worldZ) - SEAFLOOR_Y; // 0 in open ocean, rises to SHORE_PEAK_Y-SEAFLOOR_Y at full beach height — relative to the mesh's own position.y=SEAFLOOR_Y set below, not double-counted
    const bump = Math.sin(px * 0.15) * 0.3 + Math.cos(py * 0.2) * 0.25 + (Math.random() - 0.5) * 0.12;
    const bumpFade = 1 - smoothstepJS(SHORE_START_Z - 2, SHORE_END_Z, worldZ) * 0.7; // smoother sand near/on the beach, not the same choppy seafloor texture
    posAttr.setZ(i, baseOffset + bump * bumpFade); // local Z before rotation becomes world Y (up) after rotation.x below
  }
  posAttr.needsUpdate = true;
  seafloorGeo.computeVertexNormals();
  const seafloorMat = new THREE.MeshStandardNodeMaterial({ color: 0xd9c49a, roughness: 0.95 });
  // Real procedural caustics, per "rebuild ... caustics" β€” no caustics
  // texture asset exists in this standalone prototype (unlike the live
  // game's rift/textures/caustics_pattern.jpg), so this generates a
  // moving light-net pattern mathematically instead: two overlapping
  // sine grids drifting at different speeds/directions, combined via
  // min() β€” the SAME general technique the game's real caustics use
  // (two drifting samples' min() overlap, see liquid.js/main.js), just
  // procedural rather than texture-sampled here.
  // Real physically-motivated caustics, per "create the caustic effect
  // based on the actual simulated waves" β€” replaces the earlier
  // procedural sine-grid pattern entirely. Maps this seafloor fragment's
  // world XZ position back to the water grid's own coordinate space
  // (inverting the same worldX=(gx/WIDTH-0.5)*PLANE_SIZE formula used
  // elsewhere for pointer/rain positioning) and samples the ACTUAL
  // height buffer's neighbors to compute local curvature β€” the exact
  // same Laplacian quantity computeUpdate above already computes for
  // the wave physics itself, reused here for a real optical purpose: a
  // convex, crest-like region focuses light the way a converging lens
  // does (brighter caustics), a concave trough spreads it (dimmer). The
  // caustic pattern below is a direct function of the real simulated
  // wave shape, not an independently animated decoration.
  // Real physically-motivated caustics, per "make the caustics look more
  // like [a real underwater photo]" β€” a net of thin, sharp, interlocking
  // bright lines, not smooth brightness blobs (which is what the
  // previous curvature-only version produced). Real caustics form this
  // way because light rays refracting through a sloped water surface
  // physically converge along CURVES (caustic lines are literally where
  // ray density spikes), not across smooth regions β€” so this reworks
  // the technique to actually produce lines, while still deriving
  // everything from the real simulated wave data, not a decorative
  // pattern layered on top. Maps this seafloor fragment's world XZ back
  // into the water grid's coordinate space (same inversion as before)
  // and samples the ACTUAL height buffer's neighbors.
  seafloorMat.emissiveNode = Fn(() => {
    const wp = positionWorld;
    // Per "low resolution ... blockiness" β€” real bilinear interpolation
    // between the 4 nearest water-grid cells now, instead of snapping to
    // whichever single cell (via floor()) a fragment happened to round
    // into. The old version meant every fragment inside one grid cell's
    // footprint read the EXACT same slope value, creating hard visible
    // steps at cell boundaries β€” this blends smoothly across that
    // boundary instead.
    const gxF = clamp(wp.x.div(float(PLANE_SIZE)).add(0.5).mul(float(WIDTH)), 1, WIDTH - 2);
    const gyF = clamp(wp.z.div(float(PLANE_SIZE)).add(0.5).mul(float(WIDTH)), 1, WIDTH - 2);
    const gx0 = gxF.floor();
    const gy0 = gyF.floor();
    const fx = gxF.sub(gx0);
    const fy = gyF.sub(gy0);
    const slopeX = mix(
      mix(sampleSlopeX(gx0, gy0), sampleSlopeX(gx0.add(1), gy0), fx),
      mix(sampleSlopeX(gx0, gy0.add(1)), sampleSlopeX(gx0.add(1), gy0.add(1)), fx),
      fy
    );
    const slopeZ = mix(
      mix(sampleSlopeZ(gx0, gy0), sampleSlopeZ(gx0.add(1), gy0), fx),
      mix(sampleSlopeZ(gx0, gy0.add(1)), sampleSlopeZ(gx0.add(1), gy0.add(1)), fx),
      fy
    );
    const refractStrength = float(14.0);
    const refractedX = wp.x.add(slopeX.mul(refractStrength));
    const refractedZ = wp.z.add(slopeZ.mul(refractStrength));
    // Per "long straight lines" β€” wherever the real wave slope is near
    // zero (calm water, which is most of a resting ocean), the
    // refraction above is also near zero, so the underlying sine
    // pattern shows its raw, perfectly straight, perfectly periodic
    // baseline shape. This adds gentle, low-frequency organic warping
    // to the line pattern's OWN coordinates (independent of wave
    // activity, using the already-proven hash21), so lines have natural
    // irregular curves even at rest, matching how real caustic nets
    // never look like a rigid grid even over calm water.
    const warpSeed = vec2(wp.x.mul(0.06), wp.z.mul(0.06));
    const warpX = hash21(warpSeed).sub(0.5).mul(3.0);
    const warpZ = hash21(warpSeed.add(vec2(31.7, 17.3))).sub(0.5).mul(3.0);
    const warpedX = refractedX.add(warpX);
    const warpedZ = refractedZ.add(warpZ);
    // Interlocking thin-line net, three overlapping directions/scales so
    // it reads as an organic web rather than one rigid grid. Each line
    // uses |sin(...)| via max(v,-v) (already-proven primitive, avoiding
    // the unverified .abs()) raised to a high power so only the
    // near-zero-crossing band stays bright β€” a thin line, not a smooth
    // gradient.
    const lineSharpness = float(24.0);
    const s1 = sin(warpedX.mul(1.1));
    const line1 = float(1.0).sub(max(s1, s1.mul(-1))).pow(lineSharpness);
    const s2 = sin(warpedZ.mul(1.1).add(1.3));
    const line2 = float(1.0).sub(max(s2, s2.mul(-1))).pow(lineSharpness);
    const s3 = sin(warpedX.mul(0.75).add(warpedZ.mul(0.75)).add(2.4));
    const line3 = float(1.0).sub(max(s3, s3.mul(-1))).pow(lineSharpness);
    const net = max(line1, max(line2, line3));
    // Per "brightness should vary and act like reflected/refracted
    // light" β€” previously a flat constant multiplier everywhere.
    // Brightness now scales with the real slope MAGNITUDE (already-
    // proven abs-via-max technique) β€” calm water produces dim, faint
    // caustics, real active wave slopes produce brighter, more sharply
    // focused light, tying brightness itself to actual water motion.
    const slopeMag = max(slopeX, slopeX.mul(-1)).add(max(slopeZ, slopeZ.mul(-1)));
    const brightness = clamp(slopeMag.mul(6.0).add(0.35), 0.15, 1.0);
    return color(0xfff8e0).mul(net).mul(brightness).mul(0.9);
  })();
  const seafloor = new THREE.Mesh(seafloorGeo, seafloorMat);
  seafloor.rotation.x = -Math.PI / 2;
  seafloor.position.y = SEAFLOOR_Y;
  scene.add(seafloor);

  // A handful of simple grass-like blades, matching the reference
  // photo's seafloor vegetation — thin flat planes, randomly scattered
  // and scaled. Only in genuinely underwater areas now (worldZ well
  // before the shore starts rising), not scattered onto the dry beach.
  const bladeGeo = new THREE.PlaneGeometry(0.12, 1.1);
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3a, roughness: 0.85, side: THREE.DoubleSide });
  let placed = 0, attempts = 0;
  while (placed < 60 && attempts < 300) {
    attempts++;
    const bx = (Math.random() - 0.5) * PLANE_SIZE * 1.2;
    const bz = (Math.random() - 0.5) * PLANE_SIZE * 1.2;
    if (bz > SHORE_START_Z - 2) continue; // skip the beach/shore area entirely
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    blade.position.set(bx, SEAFLOOR_Y + 0.4, bz);
    blade.rotation.y = Math.random() * Math.PI;
    blade.rotation.z = (Math.random() - 0.5) * 0.3;
    const s = 0.6 + Math.random() * 0.7;
    blade.scale.set(s, s, s);
    scene.add(blade);
    placed++;
  }
}

function setupSimulation() {
  heightBufferA = instancedArray(CELL_COUNT, "float");
  heightBufferB = instancedArray(CELL_COUNT, "float");
  velocityBuffer = instancedArray(CELL_COUNT, "float");
  foamBufferA = instancedArray(CELL_COUNT, "float");
  foamBufferB = instancedArray(CELL_COUNT, "float");

  pointerWorldUniform = uniform(new THREE.Vector2(0, 0));
  pointerActiveUniform = uniform(0);

  // Real wake trail, per "add wake trails and real ripples" β€” a fixed
  // set of SEPARATE uniforms (not a TSL array uniform, which hasn't
  // been verified/used anywhere in this file, staying consistent with
  // this thread's "prefer already-proven primitives" discipline), each
  // holding one recent position from the pointer's own movement
  // history. Updated on a throttled cadence in animate() (see there),
  // shifted back like a ring buffer, decaying as they age β€” simulating
  // how a real moving body leaves a trailing wake of disturbed water
  // behind it, not just a single point that follows the current
  // position.
  wakeTrailUniforms = [];
  wakeTrailHistory = [];
  for (let wi = 0; wi < WAKE_TRAIL_LENGTH; wi++) {
    wakeTrailUniforms.push({ pos: uniform(new THREE.Vector2(0, 0)), active: uniform(0) });
    wakeTrailHistory.push({ x: 0, z: 0, active: 0 });
  }

  computeInit = Fn(() => {
    heightBufferA.element(instanceIndex).assign(0);
    heightBufferB.element(instanceIndex).assign(0);
    velocityBuffer.element(instanceIndex).assign(0);
    foamBufferA.element(instanceIndex).assign(0);
    foamBufferB.element(instanceIndex).assign(0);
  })().compute(CELL_COUNT);

  // Real neighbor-based wave update. Reads FROM heightBufferA, writes the
  // new state INTO heightBufferB (this frame's "previous" and "next"
  // buffers swap identity each call — see the animate loop below) so every
  // parallel invocation reads a fully-settled previous frame, never a
  // partially-updated one from a neighbor invocation that happened to run
  // first.
  computeUpdate = Fn(() => {
    const i = instanceIndex;
    const x = i.mod(uint(WIDTH)).toFloat();
    const y = i.div(uint(WIDTH)).toFloat();

    const self = heightBufferA.element(i);

    // Neighbor lookups, CLAMPED at the grid edges (reading the edge cell's
    // own value again when there's no real neighbor) rather than wrapping
    // around β€” a wrapped edge would let a wave that exits one side
    // reappear on the opposite side, which reads as broken/glitchy rather
    // than a real pool boundary. A clamped edge instead makes waves
    // reflect back inward, the way a real wave hitting a pool wall does.
    const xm = max(x.sub(1), float(0));
    const xp = min(x.add(1), float(WIDTH - 1));
    const ym = max(y.sub(1), float(0));
    const yp = min(y.add(1), float(WIDTH - 1));

    const idxL = y.mul(WIDTH).add(xm).toUint();
    const idxR = y.mul(WIDTH).add(xp).toUint();
    const idxU = ym.mul(WIDTH).add(x).toUint();
    const idxD = yp.mul(WIDTH).add(x).toUint();

    const left = heightBufferA.element(idxL);
    const right = heightBufferA.element(idxR);
    const up = heightBufferA.element(idxU);
    const down = heightBufferA.element(idxD);

    // The actual wave equation: acceleration is proportional to how far
    // this cell's height differs from the AVERAGE of its neighbors (the
    // discrete Laplacian) β€” a cell that's a local bump relative to its
    // surroundings gets pulled back down, one that's a local dip gets
    // pushed up. That's the real physical mechanism, not an approximation
    // of one.
    const laplacian = left.add(right).add(up).add(down).sub(self.mul(4));
    const waveSpeed = float(1.4);
    const damping = float(0.994); // slightly less than 1 β€” real water loses energy to friction/viscosity, a perfectly undamped simulation would ring forever and never settle

    // Real shore-based wave damping, per "let's build a shore" — uses
    // the EXACT same shore shape formula as the seafloor mesh
    // (SHORE_START_Z/SHORE_END_Z/SHORE_PEAK_Y), computed analytically
    // here since the seafloor is static and its shape is just this one
    // formula, not sampled from a buffer. Waves genuinely lose energy
    // approaching shallow water — a real physical damping applied to
    // the velocity itself, the same mechanism the game's own
    // SHORE_DAMP_DEPTH-based damping approximates, not a decorative
    // visual-only effect layered on top.
    const cellWorldZ = y.div(float(WIDTH)).sub(0.5).mul(float(PLANE_SIZE));
    const shoreT = clamp(cellWorldZ.sub(float(SHORE_START_Z)).div(float(SHORE_END_Z - SHORE_START_Z)), 0, 1);
    const shoreTSmooth = shoreT.mul(shoreT).mul(float(3).sub(shoreT.mul(2))); // manual smoothstep using only already-proven mul/sub, avoiding an unverified smoothstep() import
    const localFloorY = float(SEAFLOOR_Y).add(shoreTSmooth.mul(float(SHORE_PEAK_Y - SEAFLOOR_Y)));
    const localDepthAtRest = float(0).sub(localFloorY); // depth at calm water level (Y=0)
    const shoreDampFactor = clamp(localDepthAtRest.div(float(SHORE_DAMP_DEPTH)), 0.04, 1); // floored at 0.04, never fully frozen/dead even right at the sand

    const newVelocity = velocityBuffer.element(i).add(laplacian.mul(waveSpeed)).mul(damping).mul(shoreDampFactor);
    velocityBuffer.element(i).assign(newVelocity);

    let newHeight = self.add(newVelocity.mul(0.05));

    // Continuous ambient ocean chop, per explicit "add waves and ripples
    // to simulate an ocean." Per direct feedback that the previous
    // edge-limited version produced no visible motion — that version
    // injected swell only in a thin band at one edge of the grid, which
    // also happens to be the part of the plane farthest from the camera
    // (most compressed by perspective) — a real, plausible combination
    // for "technically present but effectively invisible," not
    // necessarily too weak in raw amplitude. This version applies
    // directly across the WHOLE grid every frame instead, removing the
    // camera-angle dependency entirely rather than just increasing the
    // same edge-limited approach's strength. Three overlapping sine
    // waves at different scales/directions/speeds — real ocean chop from
    // wind has no single dominant direction or period, and a single
    // frequency would read as one uniform metronome-like pulse.
    // Small per-cell phase jitter (hash21, already proven above for the
    // rain-drop selection) breaks up the chop's otherwise perfectly
    // clean periodic structure — per "lines instead of a clear fluid,"
    // a pure sine pattern has a single constant direction/frequency,
    // and real ocean chop never looks this geometrically regular. This
    // doesn't change the wave motion itself, just staggers each cell's
    // effective phase slightly so the RESULT reads as organic texture.
    const jitter = hash21(vec2(x.mul(0.08), y.mul(0.08))).sub(0.5).mul(0.4); // was mul(0.7)/mul(1.8) — much lower seed frequency (smooth across many cells, not chaotic between adjacent ones) and much smaller magnitude, since a normal is a DERIVATIVE of height and amplifies whatever noise is in its input
    const chop1 = sin(x.mul(0.22).add(y.mul(0.09)).add(time.mul(1.3)).add(jitter));
    const chop2 = sin(x.mul(0.11).sub(y.mul(0.18)).sub(time.mul(0.9)).add(jitter.mul(0.7)));
    const chop3 = sin(x.mul(0.35).add(y.mul(0.31)).add(time.mul(1.7)).add(1.7).add(jitter.mul(1.3)));
    const chop = chop1.mul(0.4).add(chop2.mul(0.3)).add(chop3.mul(0.2));
    newHeight = newHeight.add(chop.mul(0.03));

    // Rolling wave, per explicit "add a rolling wave" / "rolling waves
    // washing on the shore" β€” sweeps from open ocean (low y / low world
    // Z) toward the shore (high y / high world Z, where SHORE_START_Z/
    // SHORE_END_Z live), the same direction the shore damping above
    // measures against. This formula itself is unchanged from before β€”
    // what makes it genuinely "wash onto the shore" now is that the new
    // shoreDampFactor above naturally reduces its height as it enters
    // shallow water, the real physical mechanism, not a separate
    // scripted fade written into the wave injection itself.
    const waveCycle = float(7.0);
    const waveT = time.mod(waveCycle).div(waveCycle);
    const waveFrontY = waveT.mul(float(WIDTH + 20.0)).sub(10.0);
    const distFromFront = max(y.sub(waveFrontY), waveFrontY.sub(y));
    // Per "rolling waves ... crashes creating splashes and white foam" β€”
    // real breaking event: when the wave's own sweeping front is
    // actually crossing the shore zone (not just anywhere on the open
    // grid), add chaotic height turbulence (real breaking is genuinely
    // chaotic, not a smooth crest riding up) and capture a
    // breakingBoost value for the persistent foam buffer below to use
    // β€” a real foam BURST right at the crash point, not just the
    // existing gradual waterline-proximity foam. breakingBoost declared
    // outside the nested If (same established pattern newHeight itself
    // already uses) so it's readable later in this same function, past
    // where the rolling-wave block ends.
    const waveFrontWorldZ = waveFrontY.div(float(WIDTH)).sub(0.5).mul(float(PLANE_SIZE));
    const breakZoneDist = max(waveFrontWorldZ.sub(float(SHORE_START_Z)), float(SHORE_START_Z).sub(waveFrontWorldZ));
    let breakingBoost = float(0);
    If(distFromFront.lessThan(6.0), () => {
      const waveShape = float(1.0).sub(distFromFront.div(6.0));
      newHeight = newHeight.add(waveShape.mul(0.4));
      If(breakZoneDist.lessThan(3.0), () => {
        const turbSeed = vec2(x.add(time.mul(3.0)), y);
        const turbulence = hash21(turbSeed).sub(0.5).mul(0.5).mul(waveShape);
        newHeight = newHeight.add(turbulence);
        breakingBoost = waveShape;
      });
    });

    // Rain-drop ripples, per explicit "react when rain drops hit the
    // surface" — a NEW random subset of cells gets picked roughly every
    // 0.35s (a "rain tick"), using hash21 (proven pattern, see its own
    // comment above) seeded by each cell's position plus the current
    // tick number, so the selection changes each tick without needing
    // any JS-side management or a dedicated RNG buffer — fully
    // self-contained in the shader. floor() quantizes the tick so the
    // SAME cells stay picked for one whole tick (reads as a discrete
    // "drop" landing) rather than a different random set every single
    // frame (which would just look like flickering noise).
    const rainTick = floor(time.div(0.35));
    const rainHash = hash21(vec2(x.add(rainTick.mul(17.0)), y.add(rainTick.mul(29.0))));
    If(rainHash.lessThan(0.0006), () => {
      newHeight = newHeight.add(float(0.4));
    });

    // Real pointer-driven disturbance β€” a genuine, tangible demonstration
    // that this is an actual simulation reacting to real input, not a
    // canned animation loop. Only the cell(s) near the current pointer
    // position get pushed, each frame the pointer is held down.
    If(pointerActiveUniform.greaterThan(0), () => {
      const cellWorldX = x.div(WIDTH).sub(0.5).mul(PLANE_SIZE);
      const cellWorldZ = y.div(WIDTH).sub(0.5).mul(PLANE_SIZE);
      const dx = cellWorldX.sub(pointerWorldUniform.x);
      const dz = cellWorldZ.sub(pointerWorldUniform.y);
      const distSq = dx.mul(dx).add(dz.mul(dz));
      const radius = float(1.8); // widened from 1.4 — a body-sized disturbance stand-in for "player swimming," per explicit request; a real player-position-driven version needs actual game integration (see response text)
      If(distSq.lessThan(radius.mul(radius)), () => {
        newHeight = newHeight.add(float(0.4));
      });
    });

    // Real wake trail injection, per "add wake trails and real ripples"
    // β€” same disturbance technique as the main pointer push above,
    // looped across the fixed trail positions, each scaled by its own
    // decayed activity (older trail points are weaker, per the decay
    // applied in animate()'s update). cellWorldX/Z recomputed fresh here
    // (not reused from the pointer block above, which only declares
    // them inside its own nested If() scope, not accessible out here).
    const wakeCellWorldX = x.div(float(WIDTH)).sub(0.5).mul(float(PLANE_SIZE));
    const wakeCellWorldZ = y.div(float(WIDTH)).sub(0.5).mul(float(PLANE_SIZE));
    for (let wi = 0; wi < WAKE_TRAIL_LENGTH; wi++) {
      const wp = wakeTrailUniforms[wi];
      If(wp.active.greaterThan(0.04), () => {
        const wdx = wakeCellWorldX.sub(wp.pos.x);
        const wdz = wakeCellWorldZ.sub(wp.pos.y);
        const wDistSq = wdx.mul(wdx).add(wdz.mul(wdz));
        const wRadius = float(1.15);
        If(wDistSq.lessThan(wRadius.mul(wRadius)), () => {
          newHeight = newHeight.add(float(0.16).mul(wp.active));
        });
      });
    }

    // Real persistent backwash foam, per "creating foam as it draws back
    // in" β€” uses the FULLY finalized newHeight (after chop/rolling-wave/
    // rain/pointer are all already applied above), compared against the
    // same localFloorY shore formula already computed for the damping
    // above. Distance-to-waterline uses max(a,-a) for absolute value
    // (already-proven max/mul, avoiding the unverified .abs()). When
    // genuinely in the wash zone, foam jumps toward full strength;
    // otherwise it decays slowly (0.955/frame β‰ˆ a couple seconds to
    // fade) rather than vanishing the instant the water pulls back β€”
    // the actual "draws back in" lingering effect requested.
    const distToWaterlineUpdate = max(newHeight.sub(localFloorY), localFloorY.sub(newHeight));
    const prevFoam = foamBufferA.element(i);
    let newFoam = prevFoam.mul(0.955);
    If(distToWaterlineUpdate.lessThan(0.5), () => {
      const freshFoam = float(1.0).sub(distToWaterlineUpdate.div(0.5));
      newFoam = max(newFoam, freshFoam);
    });
    newFoam = max(newFoam, breakingBoost); // real crash burst from the wave-breaking event above, independent of waterline proximity
    foamBufferB.element(i).assign(clamp(newFoam, 0, 1));

    heightBufferB.element(i).assign(newHeight);
  })().compute(CELL_COUNT);

  // Per confirmed error: "renderer.copyBufferToBuffer is not a function" —
  // that method doesn't exist on this renderer. Rather than guess at
  // some other renderer-level API for this (another unverified surface,
  // same risk category that caused this exact bug), this does the copy
  // using ONLY the technique already proven working elsewhere in this
  // same file: a real compute shader, dispatched via computeAsync, doing
  // a trivial per-cell assignment. Same reliability as computeInit/
  // computeUpdate, since it's the identical mechanism.
  computeCopyBack = Fn(() => {
    heightBufferA.element(instanceIndex).assign(heightBufferB.element(instanceIndex));
    foamBufferA.element(instanceIndex).assign(foamBufferB.element(instanceIndex));
  })().compute(CELL_COUNT);
}

function setupMesh() {
  const geometry = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, WIDTH - 1, WIDTH - 1);
  geometry.rotateX(-Math.PI / 2);

  // Explicit vertex-to-cell mapping, rather than relying on instanceIndex
  // (a compute-shader concept) inside the material's shaders, which run in
  // a different context. PlaneGeometry with WIDTH-1 segments lays out
  // vertices in row-major order matching exactly how the height buffer is
  // indexed above (x + y*WIDTH), so this is a direct 1:1 correspondence,
  // not an approximation.
  const cellIndices = new Float32Array(WIDTH * WIDTH);
  for (let i = 0; i < cellIndices.length; i++) cellIndices[i] = i;
  geometry.setAttribute("cellIndex", new THREE.Float32BufferAttribute(cellIndices, 1));

  const material = new THREE.MeshStandardNodeMaterial({
    color: 0x2a6f8f,
    roughness: 0.28,
    metalness: 0.05,
    emissive: 0x061018,
  });

  const cellIdx = attribute("cellIndex", "float").toUint();

  // Displace each vertex's Y directly from the height buffer, indexed by
  // the explicit cellIndex attribute above.

  // Real per-wave normals, per "make it look physically close to real
  // water" — until now this geometry only displaced vertex Y, leaving
  // the ORIGINAL flat plane normals untouched, meaning lighting/fresnel/
  // reflections never responded to the actual wave slopes at all, only
  // to a constant "flat up" direction regardless of how steep any given
  // wave face was. This uses the standard tangent/bitangent cross-
  // product technique (confirmed as the established approach for this
  // exact problem — computing normals from a height-displaced surface)
  // sampling neighbor heights via the same cellIndex-based lookup the
  // material already uses for position/color, so no new buffer or
  // compute pass is needed. Shared Fn (same pattern as waterColorAt/
  // hash21 above) since both normalNode and the sun-glint term in
  // emissiveNode below need the same real normal.
  const computeWaveNormal = Fn(() => {
    const cx = cellIdx.mod(uint(WIDTH)).toFloat();
    const cy = cellIdx.div(uint(WIDTH)).toFloat();
    const hC = heightBufferNode.element(cellIdx);
    const cxRight = min(cx.add(1), float(WIDTH - 1));
    const cyDown = min(cy.add(1), float(WIDTH - 1));
    const idxRight = cy.mul(WIDTH).add(cxRight).toUint();
    const idxDown = cyDown.mul(WIDTH).add(cx).toUint();
    const hRight = heightBufferNode.element(idxRight);
    const hDown = heightBufferNode.element(idxDown);
    const cellSpacing = float(PLANE_SIZE / WIDTH);
    const tangent = vec3(cellSpacing, hRight.sub(hC), 0);
    const bitangent = vec3(0, hDown.sub(hC), cellSpacing);
    return cross(bitangent, tangent).normalize();
  });

  material.positionNode = Fn(() => {
    const heightAtVertex = heightBufferNode.element(cellIdx);
    return positionLocal.add(vec3(0, heightAtVertex, 0));
  })();
  material.normalNode = computeWaveNormal();

  // Approximate shading from the height field itself: darker where the
  // surface has a steeper local slope (a cheap stand-in for real normal
  // recomputation β€” accurate per-vertex normals would need sampling
  // neighbor heights again in a second pass, worth adding once the basic
  // motion itself is confirmed working live).
  // Shared water-color logic (same Fn([arg]) pattern already proven
  // working for hash21 above), used by both colorNode and emissiveNode
  // below rather than duplicating the same blend logic twice.
  // Real colors ported directly from the live game's liquid.js, per "I
  // like how the waves look in the game" — not reinvented guesses.
  // shallow/deep are the game's own tuned LIQUID_STYLE.crystal values
  // (baseColor 0x1f7fb0 IS the game's "deep" color; 0x7fd0d8 is its
  // shoreline "shallow" color, both from a real depth-based vertex-color
  // blend in liquid.js), and foam is the game's own frothColor (pure
  // white), not an invented off-white.
  const waterColorAt = Fn(([h]) => {
    const deep = color(0x1f7fb0);
    const shallow = color(0x7fd0d8);
    const foam = color(0xffffff);
    const t = clamp(h.mul(2.4).add(0.35), 0, 1);
    const waterColor = mix(deep, shallow, t);
    const foamStart = float(0.22);
    const foamFull = float(0.34);
    const foamAmount = clamp(h.sub(foamStart).div(foamFull.sub(foamStart)), 0, 1);
    return mix(waterColor, foam, foamAmount);
  });

  material.colorNode = Fn(() => {
    const heightAtVertex = heightBufferNode.element(cellIdx);
    // Per "translucent blue-green with foam like the ocean" (reference
    // photo showed deep teal water with white foam only at wave crests,
    // not an even gradient) — three-stage blend instead of the previous
    // two-color mix: deep teal in troughs, brighter turquoise on rising
    // slopes, and real white foam ONLY where height genuinely peaks
    // (foamStart/foamFull threshold band) rather than a uniform tint
    // change, so foam reads as a real crest feature, not just "the
    // color at the top of the gradient."
    const baseColor = waterColorAt(heightAtVertex);
    // Per "let's build a shore" — localFloorYColor uses the SAME real
    // shore-shape formula as the seafloor mesh and the wave damping in
    // computeUpdate (SHORE_START_Z/SHORE_END_Z/SHORE_PEAK_Y), not the
    // flat SEAFLOOR_Y constant this used before there was an actual
    // sloped shore β€” so depth-based darkening now correctly reads as
    // shallower/lighter near the beach instead of showing the same
    // open-ocean depth everywhere.
    const worldZ = positionWorld.z;
    const shoreTColor = clamp(worldZ.sub(float(SHORE_START_Z)).div(float(SHORE_END_Z - SHORE_START_Z)), 0, 1);
    const shoreTColorSmooth = shoreTColor.mul(shoreTColor).mul(float(3).sub(shoreTColor.mul(2)));
    const localFloorYColor = float(SEAFLOOR_Y).add(shoreTColorSmooth.mul(float(SHORE_PEAK_Y - SEAFLOOR_Y)));
    // Per "add volume below the waves and a seafloor" — now that a real
    // seafloor mesh exists at a known Y (SEAFLOOR_Y), this computes
    // GENUINE depth (actual water-surface world Y minus the seafloor's
    // Y) rather than the previous fresnel-only approximation from before
    // there was any seafloor to measure against. positionWorld.y already
    // reflects the real, wave-displaced surface height at this exact
    // point (positionNode's displacement has already been applied by the
    // time colorNode evaluates), so this is a real per-fragment depth
    // value, not a height-buffer proxy.
    const localDepth = positionWorld.y.sub(localFloorYColor);
    const depthDarken = clamp(localDepth.div(6.0), 0, 1);
    const deepVolume = color(0x061824); // matches liquid.js's own FAR_DARKEN_COLOR — the game's real far-distance/deep darkening tone, not an independently invented one
    const depthBlended = mix(baseColor, deepVolume, depthDarken.mul(0.5));
    // Real shore-wash foam, per "rebuild foam ... waves washing on the
    // shore" β€” white foam specifically where the water's actual current
    // surface height is close to the real sloped beach beneath it (the
    // moving waterline), not a fixed-position zone. distToWaterline uses
    // max(a,-a) for absolute value (already-proven max/mul, avoiding the
    // unverified .abs(), same discipline as the rolling wave above).
    // This is a genuinely different foam trigger than the crest foam in
    // waterColorAt β€” that one fires on wave height everywhere, this one
    // fires on shore proximity specifically, and the two combine
    // naturally since a wave crest reaching the shore satisfies both.
    // Per "creating foam as it draws back in" β€” now reads the PERSISTENT
    // foam buffer (computeUpdate above) instead of a purely instantaneous
    // position check, so foam genuinely lingers for a moment as a wave
    // recedes rather than disappearing the instant the water pulls back.
    const foamPersist = foamBufferNode.element(cellIdx);
    const washed = mix(depthBlended, color(0xffffff), foamPersist.mul(0.85));
    // Real whitecap foam, per "ocean waves have white caps as it crests"
    // β€” real whitecaps form specifically where the water surface is
    // genuinely STEEP (an actual physical response to wave steepness,
    // not just "high"), reusing computeWaveNormal's real slope data
    // rather than a separate invented calculation. normal.y is 1 on a
    // flat surface and drops as the surface tilts, so (1-normal.y) is a
    // direct steepness measure. Also gated by height being positive
    // (a cresting/rising face, not a trough, even if a trough happened
    // to be locally steep) since real whitecaps form on wave crests.
    const whitecapNormal = computeWaveNormal();
    const steepness = clamp(float(1.0).sub(whitecapNormal.y).mul(4.0), 0, 1);
    const whitecapAmount = clamp(steepness.mul(2.0).sub(0.3), 0, 1).mul(clamp(heightAtVertex.mul(3.0), 0, 1));
    const whitecapped = mix(washed, color(0xffffff), whitecapAmount.mul(0.75));
    // Fresnel still contributes on top — a grazing viewing angle means a
    // genuinely longer path through the water even at the SAME depth, so
    // this is a real, separate, additional effect layered on the actual
    // depth term above, not a replacement for it.
    const viewDir = cameraPosition.sub(positionWorld).normalize();
    const fresnel = float(1).sub(clamp(normalWorld.dot(viewDir), 0, 1)).pow(3);
    return mix(whitecapped, deepVolume, fresnel.mul(0.3));
  })();
  // Per "what are we missing, does it need light/shaders" — a real,
  // specific cause: at a low, grazing camera angle (as seen in the
  // reported screenshot), reflectivity dominates a PBR material's
  // appearance far more than its own diffuse color, and this scene's
  // background is a flat, dark navy with no real sky/environment — so
  // what reflects back at that angle is just flat dark color, masking
  // the actual teal/foam regardless of whether colorNode itself is
  // working correctly. This emissiveNode gives the water's own color a
  // GUARANTEED baseline presence, independent of lighting/reflection
  // angle, rather than trying to perfectly tune reflectivity instead.
  material.emissiveNode = Fn(() => {
    const heightAtVertex = heightBufferNode.element(cellIdx);
    const baseEmissive = waterColorAt(heightAtVertex).mul(0.22);
    // Sun glint, per "make it look physically close to real water" — one
    // of the most recognizable real-water visual cues (a bright, moving
    // highlight where the sun's reflection lands), and only possible now
    // that real per-wave normals exist above — a flat normal would give
    // one uniform highlight everywhere rather than one that genuinely
    // tracks individual wave faces. sunDir is a constant matching this
    // scene's actual DirectionalLight position (15,25,10, normalized),
    // not an arbitrary separate direction.
    const normal = computeWaveNormal();
    const viewDir = cameraPosition.sub(positionWorld).normalize();
    const sunDir = vec3(0.4867, 0.8111, 0.3244);
    const reflectDir = reflect(viewDir.mul(-1), normal);
    const sunAlign = clamp(dot(reflectDir, sunDir), 0, 1);
    const glint = sunAlign.pow(28); // was 120 — per "lines instead of a clear fluid," a razor-sharp exponent this sensitive to normal direction was very likely amplifying the chop's own periodic structure into visible banding; a wider, softer highlight is both more realistic and less prone to this
    return baseEmissive.add(color(0xfff8e0).mul(glint).mul(1.4)); // brightness also reduced (3.0->1.4) alongside the softer falloff, so the highlight doesn't overpower with the wider spread
  })();
  material.transparent = true;
  material.opacity = 0.88; // per "translucent" — a straightforward base alpha; the fresnel/volume effect above handles depth-based color, this is a separate flat transparency layer on top
  material.roughness = 0.4; // raised from the previous 0.18 (and above the original 0.28) — specifically to reduce mirror-like reflection dominance at grazing angles, which was likely the real cause of the flat gray-blue look, not a color-code problem

  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(60, 48),
    new THREE.MeshStandardMaterial({ color: 0x0c1420, roughness: 1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3;
  scene.add(floor);
}

function setupPointerInteraction(canvas) {
  function updatePointerNDC(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function raycastToPlane() {
    pointerRay.setFromCamera(pointerNDC, camera);
    const planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hit = new THREE.Vector3();
    if (pointerRay.ray.intersectPlane(planeY, hit)) {
      pointerWorldUniform.value.set(hit.x, hit.z);
      pointerActiveUniform.value = 1;
    } else {
      pointerActiveUniform.value = 0;
    }
  }

  canvas.addEventListener("pointerdown", (e) => {
    pointerDown = true;
    updatePointerNDC(e.clientX, e.clientY);
    raycastToPlane();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!pointerDown) return;
    updatePointerNDC(e.clientX, e.clientY);
    raycastToPlane();
  });
  window.addEventListener("pointerup", () => {
    pointerDown = false;
    pointerActiveUniform.value = 0;
  });
}

let simInitialized = false;
let animateFailedOnce = false;
async function animate() {
  try {
    const dt = Math.min(clock.getDelta(), 0.1);
    controls.update();

    if (!simInitialized) {
      await renderer.computeAsync(computeInit);
      simInitialized = true;
    }

    // computeUpdate always reads FROM heightBufferA and writes its result
    // INTO heightBufferB (see setupSimulation) — computeCopyBack then
    // copies B back into A, every frame, keeping the next frame's read
    // consistent without needing a more complex alternating-buffer-
    // identity scheme. Both dispatched via computeAsync, real GPU-side
    // work — not a CPU round-trip, and not renderer.copyBufferToBuffer
    // (confirmed not to exist on this renderer; see computeCopyBack's
    // own comment in setupSimulation for why a compute shader replaces
    // it instead of guessing at some other renderer-level API).
    await renderer.computeAsync(computeUpdate);
    await renderer.computeAsync(computeCopyBack);

    // Gentle flicker for the underwater light-ray meshes, matching how
    // real light shafts shimmer as the water surface moves above them —
    // plain per-frame opacity modulation, not tied to the compute
    // simulation itself.
    const nowT = clock.elapsedTime;
    for (const ray of lightRayMeshes) {
      // Real water-motion-driven brightness, per "vary dynamically with
      // the water" β€” uses approxWaterChop (mirrors the actual compute
      // shader's own ambient-chop formula) evaluated at this ray's real
      // position, not a disconnected time-only sine wave. abs() since
      // chop can be negative (a trough) but brightness shouldn't.
      const chopHere = Math.abs(approxWaterChop(ray.position.x, ray.position.z, nowT));
      const brightness = 0.55 + chopHere * 0.9;
      ray.material.opacity = ray.userData.baseOpacity * Math.min(1.4, brightness);
    }

    // Real splash particles, per "physics ... splashes" β€” spawned only
    // when currentBreakWorldZ confirms an actual break is happening
    // right now (mirrors the compute shader's own real break-detection
    // formula), scattered across the wave's actual width along that
    // break line, not spawned arbitrarily.
    const breakZ = currentBreakWorldZ(nowT);
    if (breakZ !== null) {
      for (let i = 0; i < 1; i++) {
        spawnSplashParticle((Math.random() - 0.5) * (PLANE_SIZE * 0.9), breakZ);
      }
    }

    // Real wake trail update, per "add wake trails" β€” throttled (not
    // every single frame) so the trail reads as evenly-spaced recent
    // positions rather than an overly dense, jittery blur. Shifts the
    // history back one slot (ring-buffer style), decaying each point's
    // strength as it ages further back, then pushes the pointer's real
    // current position/activity into the front slot.
    if (nowT - lastWakeUpdateTime > 0.12) {
      lastWakeUpdateTime = nowT;
      for (let wi = WAKE_TRAIL_LENGTH - 1; wi > 0; wi--) {
        wakeTrailHistory[wi].x = wakeTrailHistory[wi - 1].x;
        wakeTrailHistory[wi].z = wakeTrailHistory[wi - 1].z;
        wakeTrailHistory[wi].active = wakeTrailHistory[wi - 1].active * 0.82;
      }
      wakeTrailHistory[0].x = pointerWorldUniform.value.x;
      wakeTrailHistory[0].z = pointerWorldUniform.value.y;
      wakeTrailHistory[0].active = pointerActiveUniform.value;
      for (let wi = 0; wi < WAKE_TRAIL_LENGTH; wi++) {
        wakeTrailUniforms[wi].pos.value.set(wakeTrailHistory[wi].x, wakeTrailHistory[wi].z);
        wakeTrailUniforms[wi].active.value = wakeTrailHistory[wi].active;
      }
    }
    updateSplashParticles(dt);

    renderer.render(scene, camera);
  } catch (err) {
    // Per "setup succeeds (status says Running) but nothing displays" —
    // renderer.setAnimationLoop calls this function every frame WITHOUT
    // awaiting or catching whatever it returns, so any error in here was
    // previously becoming a silent, invisible unhandled promise rejection
    // — the render loop could fail on literally every single frame with
    // zero visible trace of why. Now it surfaces to the status text (and
    // the real console error, for anyone who does have devtools access)
    // and stops the loop after the first failure, rather than either
    // failing silently forever or spamming errors every frame.
    if (!animateFailedOnce) {
      animateFailedOnce = true;
      console.error("[fluid-sim] animate() failed:", err);
      setStatus("Render loop error: " + err.message + " — see console for full details.", true);
      renderer.setAnimationLoop(null);
    }
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init().catch((err) => {
  console.error(err);
  setStatus("WebGPU initialization failed: " + err.message, true);
});
</script>
</body>
