<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rift Water Lab · Independent Ocean Prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#061522;color:#eafcff}*{box-sizing:border-box}body{margin:0;overflow:hidden}#scene{display:block;width:100vw;height:100dvh;touch-action:none}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.panel{background:rgba(3,21,37,.8);border:1px solid rgba(102,231,235,.33);backdrop-filter:blur(15px);border-radius:14px;padding:10px 12px;box-shadow:0 9px 25px #0005;pointer-events:auto}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.025em}small{display:block;color:#9cc4cf;font-size:11px;margin-top:4px}.stat{font:12px ui-monospace,monospace;color:#b4f9eb;text-align:right;line-height:1.6}
#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:560px;margin:auto;display:grid;gap:8px;pointer-events:none}#lab-settings>summary{list-style:none;cursor:pointer;text-align:center;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 0;user-select:none;color:#b8e9eb}#lab-settings>summary::-webkit-details-marker{display:none}#lab-settings>summary:after{content:'  ▴'}#lab-settings[open]>summary:after{content:'  ▾'}#lab-settings:not([open]){padding:9px 12px}#lab-settings:focus-within{border-color:#68dce0}.controls{pointer-events:auto}
.segment{display:flex;gap:6px}.segment button{flex:1}button{border:1px solid #33677d;border-radius:9px;background:#103347;color:#d9fcff;padding:10px 9px;font:600 12px system-ui;cursor:pointer}button[aria-pressed=true]{background:#237f91;border-color:#76e7ec;color:white}
 .inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;max-height:min(45dvh,390px);overflow-y:auto;overscroll-behavior:contain;padding:12px 4px 6px;touch-action:pan-y}.inputs label{font-size:11px;color:#bed7e3;display:block}.inputs output{float:right;color:#9eebe7;font-family:ui-monospace,monospace}input[type=range]{width:100%;accent-color:#45d1da}
#hint{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:11px;color:#d7eff9aa;pointer-events:none;text-align:center;white-space:nowrap}a{color:#a5f2ef;text-decoration:none}#status{color:#f8cda3;font-size:11px;display:none;margin-top:6px}
@media(max-height:680px){.inputs{grid-template-columns:repeat(4,1fr)}#hint{display:none}.panel{padding:8px 10px}}
</style></head>
<body><canvas id="scene"></canvas><header id="top"><div class="panel"><h1>Rift · Water Lab <span style="color:#78e8ef">10.12</span></h1><small>Independent ocean research · no game changes</small><div id="status"></div></div><div class="panel stat"><span id="fps">FPS —</span><br><span id="tri">Triangles —</span><br><a href="rift-play.html">Back to Rift</a></div></header>
<div id="hint">Drag to look around · experiment with wave motion</div>
<section id="controls"><div class="panel controls"><div class="segment" id="views"><button data-view="surface" aria-pressed="true">Ocean surface</button><button data-view="waterline" aria-pressed="false">Waterline</button><button data-view="underwater" aria-pressed="false">Underwater</button></div></div><details class="panel controls" id="lab-settings"><summary>Adjust water settings</summary><div class="inputs">
<label>Wave height <output id="heightOut">1.0</output><input id="height" type="range" min=".25" max="2.6" step=".05" value="1"></label>
<label>Wind / chop <output id="chopOut">1.0</output><input id="chop" type="range" min=".2" max="2.5" step=".05" value="1"></label>
<label>Surface detail <output id="surfaceDetailOut">1.0</output><input id="surfaceDetail" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Rolling swells <output id="swellComplexityOut">1.0</output><input id="swellComplexity" type="range" min="0" max="1.5" step=".05" value="1"></label>
<label>Breaking crest foam <output id="crestFoamOut">1.0</output><input id="crestFoam" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Sunlight <output id="sunOut">1.0</output><input id="sun" type="range" min=".2" max="1.9" step=".05" value="1"></label>
<label>Water clarity <output id="clarityOut">1.0</output><input id="clarity" type="range" min=".25" max="2.0" step=".05" value="1"></label>
<label>Caustic intensity <output id="causticsOut">1.0</output><input id="caustics" type="range" min="0" max="2.0" step=".05" value="1"></label>
<label>Caustic motion <output id="causticSpeedOut">1.0</output><input id="causticSpeed" type="range" min=".2" max="2" step=".05" value="1"></label>
<label>Caustic curvature <output id="causticCurvatureOut">1.0</output><input id="causticCurvature" type="range" min="0" max="2.2" step=".05" value="1"></label>
<label>Line focus <output id="causticFocusOut">1.0</output><input id="causticFocus" type="range" min=".25" max="1.8" step=".05" value="1"></label>
<label>Rock occlusion <output id="occlusionOut">1.0</output><input id="occlusion" type="range" min="0" max="1" step=".05" value="1"></label>
<label>Refraction <output id="refractionOut">1.0</output><input id="refraction" type="range" min="0" max="1.8" step=".05" value="1"></label>
<label>Ceiling detail <output id="ceilingDetailOut">1.0</output><input id="ceilingDetail" type="range" min="0" max="2.0" step=".05" value="1"></label>
<label>Ceiling skylight <output id="ceilingLightOut">1.0</output><input id="ceilingLight" type="range" min=".35" max="2.0" step=".05" value="1"></label>
<label>Water volume <output id="volumeOut">1.0</output><input id="volume" type="range" min="0" max="1" step=".05" value="1"></label>
<label>Sunbeams <output id="shaftsOut">1.0</output><input id="shafts" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Sun glint <output id="glintOut">1.0</output><input id="glint" type="range" min="0" max="2.5" step=".05" value="1"></label>
<label>Light penetration <output id="penetrationOut">1.0</output><input id="penetration" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Underside window <output id="undersideWindowOut">1.0</output><input id="undersideWindow" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Underwater shimmer <output id="undersideShimmerOut">1.0</output><input id="undersideShimmer" type="range" min="0" max="2" step=".05" value="1"></label>
<label>Physical light coupling <output id="physicalLightOut">1.0</output><input id="physicalLight" type="range" min="0" max="1" step=".05" value="1"></label>
</div></details></section>
<script type="module" src="./rift/water_lab_standalone.js?lab=foam-crest-fix-v10-12"></script></body></html>
