# Deploy production plus isolated renderer/lighting previews.
#
# IMPORTANT: only main publishes to the protected github-pages environment.
# Review branches are staged by this main workflow below, so pushes to those
# branches must not start their own Pages deployment jobs (GitHub rejects those
# before any steps run when the environment only permits main).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main

      # Fluid review builds only replace the isolated fluid-v5-preview path.
      # Avoid spending ~40-60 minutes recompressing unrelated environment GLBs.
      - name: Detect fluid-only deployment
        id: deploy-scope
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          fluid_only=false
          mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")

          if [[ "$HEAD_COMMIT_MESSAGE" == *"[fluid-preview]"* ]]; then
            fluid_only=true
          elif [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == ".github/fluid-v5-preview-version.txt" ]]; then
            fluid_only=true
          fi

          echo "fluid_only=$fluid_only" >> "$GITHUB_OUTPUT"
          echo "Fluid-only deployment: $fluid_only"
          printf 'Changed path: %s\n' "${changed_paths[@]}"

      - name: Promote known-good r185 runtime to production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("three@0.182.0", "three@0.185.1")
          marker = '<script>window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="r185-known-good-v10";</script>'
          if marker not in html:
              html = html.replace("</head>", marker + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      - name: Checkout r185 migration preview
        uses: actions/checkout@v4
        with:
          ref: three-r185-migration
          path: .r185-preview-source

      - name: Stage r185 preview
        shell: bash
        run: |
          rm -rf r185-build
          mkdir -p r185-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .r185-preview-source/ r185-build/
          rm -rf .r185-preview-source

      - name: Checkout shadow v11 experiment
        uses: actions/checkout@v4
        with:
          ref: shadow-v11-experiment
          path: .shadow-v11-preview-source

      - name: Stage shadow v11 experiment
        shell: bash
        run: |
          rm -rf shadow-v11-build
          mkdir -p shadow-v11-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .shadow-v11-preview-source/ shadow-v11-build/
          rm -rf .shadow-v11-preview-source

      - name: Checkout Rift Lighting 2.0 experiment
        uses: actions/checkout@v4
        with:
          ref: rift-lighting-v20-experiment
          path: .lighting-v20-preview-source

      - name: Stage Rift Lighting 2.0 experiment
        shell: bash
        run: |
          rm -rf lighting-v20-build
          mkdir -p lighting-v20-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .lighting-v20-preview-source/ lighting-v20-build/
          rm -rf .lighting-v20-preview-source

      # Cloud Model 3 stays isolated from production while it is reviewed.
      - name: Checkout Cloud Model 3 preview
        uses: actions/checkout@v4
        with:
          ref: cloud-model3-reference-volumetrics-v2
          path: .cloud-model3-preview-source

      - name: Stage Cloud Model 3 preview
        shell: bash
        run: |
          rm -rf cloud-model3-build
          mkdir -p cloud-model3-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .cloud-model3-preview-source/ cloud-model3-build/
          rm -rf .cloud-model3-preview-source
          python - <<'PY'
          from pathlib import Path
          p = Path("cloud-model3-build/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("three@0.182.0", "three@0.185.1")
          marker = '<script>window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="cloud-model35-review";</script>'
          if marker not in html:
              html = html.replace("</head>", marker + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      # Model 4 reconstructs the volumetric macro density from the sky reference
      # textures and therefore gets its own isolated Pages path for iPhone review.
      - name: Checkout Cloud Model 4 preview
        uses: actions/checkout@v4
        with:
          ref: cloud-model4-reference-reconstruction-v1
          path: .cloud-model4-preview-source

      - name: Stage Cloud Model 4 preview
        shell: bash
        run: |
          rm -rf cloud-model4-build
          mkdir -p cloud-model4-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .cloud-model4-preview-source/ cloud-model4-build/
          rm -rf .cloud-model4-preview-source
          python - <<'PY'
          from pathlib import Path
          p = Path("cloud-model4-build/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("three@0.182.0", "three@0.185.1")
          marker = '<script>window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="cloud-model441-mobile-webgpu-stability";</script>'
          if marker not in html:
              html = html.replace("</head>", marker + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      # Environment Performance is an A/B preview based directly on the current
      # known-good production commit. In addition to the runtime performance
      # changes on perf-environment-1, this Pages-only build step converts the
      # real GLB material textures to KTX2/Basis Universal without touching the
      # source branch binaries. That keeps the experiment reversible and lets us
      # measure GPU-memory/bandwidth effects independently.
      - name: Checkout Environment Performance preview
        uses: actions/checkout@v4
        with:
          ref: perf-environment-1
          path: .perf-environment-preview-source

      - name: Build KTX2 model textures for performance preview
        if: steps.deploy-scope.outputs.fluid_only != 'true'
        shell: bash
        run: |
          set -u

          echo "Installing Khronos KTX-Software 4.4.2..."
          curl -L --fail --retry 3 \
            -o /tmp/ktx-software.deb \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          sudo dpkg -i /tmp/ktx-software.deb || sudo apt-get -f install -y

          echo "Installing glTF Transform CLI..."
          npm install --global @gltf-transform/cli@4.4.2

          cd .perf-environment-preview-source/rift/models

          files=(
            angelfish.glb
            stylaster.glb
            pocillopora.glb
            goniastrea.glb
            meandrina.glb
            heliopora.glb
            acropora.glb
            distichopora.glb
            coconut_low_poly.glb
            coconut_palm.glb
            palm_trees.glb
            9_aplysina_fistularis.glb
            tropical_plant.glb
          )

          converted=0
          skipped=0
          failed=0
          before_total=0
          after_total=0

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[KTX2] skip missing: $file"
              skipped=$((skipped + 1))
              continue
            fi

            bytes=$(stat -c%s "$file")
            if [ "$bytes" -lt 1024 ]; then
              echo "[KTX2] skip placeholder: $file ($bytes bytes)"
              skipped=$((skipped + 1))
              continue
            fi

            magic=$(head -c 4 "$file" || true)
            if [ "$magic" != "glTF" ]; then
              echo "[KTX2] skip non-binary glTF/LFS pointer: $file"
              skipped=$((skipped + 1))
              continue
            fi

            stem="${file%.glb}"
            stage1="${stem}.uastc.tmp.glb"
            stage2="${stem}.ktx2.tmp.glb"
            rm -f "$stage1" "$stage2"

            echo "[KTX2] converting $file"
            if gltf-transform uastc "$file" "$stage1" \
                --slots "{normalTexture,occlusionTexture,metallicRoughnessTexture}" \
                --level 4 --rdo --rdo-lambda 4 --zstd 18 --verbose \
              && gltf-transform etc1s "$stage1" "$stage2" \
                --quality 255 --verbose; then
              before=$(stat -c%s "$file")
              after=$(stat -c%s "$stage2")
              before_total=$((before_total + before))
              after_total=$((after_total + after))
              mv "$stage2" "$file"
              rm -f "$stage1"
              converted=$((converted + 1))
              echo "[KTX2] $file: $before -> $after bytes"
            else
              echo "[KTX2] WARNING: conversion failed; keeping original $file"
              rm -f "$stage1" "$stage2"
              failed=$((failed + 1))
            fi
          done

          echo "[KTX2] converted=$converted skipped=$skipped failed=$failed"
          echo "[KTX2] selected asset bytes: $before_total -> $after_total"
          if command -v toktx >/dev/null 2>&1; then toktx --version || true; fi

      - name: Stage Environment Performance preview
        shell: bash
        run: |
          rm -rf perf-environment-build
          mkdir -p perf-environment-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .perf-environment-preview-source/ perf-environment-build/
          rm -rf .perf-environment-preview-source
          python - <<'PY'
          from pathlib import Path
          p = Path("perf-environment-build/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace("three@0.182.0", "three@0.185.1")
          marker = '<script>window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="environment-performance-1.2-ktx2";</script>'
          if marker not in html:
              html = html.replace("</head>", marker + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      # Fluid V8 remains isolated on fluid-v5-development. This main-only Pages workflow
      # stages the branch into a review path without merging any Fluid V8 source to production.
      - name: Checkout Fluid V8 development preview
        uses: actions/checkout@v4
        with:
          ref: fluid-v5-development
          path: .fluid-v5-preview-source

      - name: Stage Fluid V8 development preview
        shell: bash
        run: |
          rm -rf fluid-v5-preview
          mkdir -p fluid-v5-preview
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .fluid-v5-preview-source/fluid-v5-pbf/ fluid-v5-preview/
          rm -rf .fluid-v5-preview-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
