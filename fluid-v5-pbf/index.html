<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid Simulation Lab</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5;max-width:84vw}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID SIMULATION LAB</b><small>loading the common-water solver and scenario laboratory…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  const query=new URLSearchParams(location.search);
  const scenarios=new Set(['pool','wave','rain','dam','drain','faucet','waterfall','paddle','whirlpool','fountain','pour']);
  const requested=scenarios.has(query.get('scenario'))?query.get('scenario'):'pool';
  const dock="<script type=\"module\" src=\"./src/v5-scenario-dock.js?v=9002\"><\/script>";
  try{
    let html;
    if(requested==='pour'){
      boot.querySelector('small').textContent='loading the local GLB jug · fitting the PBF reservoir · arming gravity-only pour…';
      const forced={quality:'high',particles:'10500',spacing:'0.019',box:'1.16 1.50 0.74',bodies:'0',bodyphases:'0',substeps:'4',iters:'6',xsph:'0.045',scorr:'0.080',tension:'0.004',ssfrscale:'1.0',ssfrfilter:'2',ssfriters:'3',ssfrthickblur:'4',ssfrradius:'1.24',timing:'0',force:'0',grab:'0',v:'899local'};
      for(const [key,value] of Object.entries(forced))query.set(key,value);
      history.replaceState(null,'',location.pathname+'?'+query.toString()+location.hash);
      const r=await fetch('./m830.html?pour=9005',{cache:'no-store'});if(!r.ok)throw new Error(`Fluid V8 pour shell failed: HTTP ${r.status}`);html=await r.text();
      const sceneLine=" note.textContent='loading Pool + Dam Break seeds…';await import('./src/v5-scenes-only-m743.js');";
      if(!html.includes(sceneLine))throw new Error('Fluid V8 pour bootstrap could not locate the static scene import.');
      const skipped=['v5-wave-lab-m745.js','v5-physical-scenes-m752.js','v5-scaled-scenes-m754.js','v5-realism-shader-m746.js','v5-water-appearance-m747.js','v5-pool-material-m748.js','v5-pool-environment-m749.js','v5-fluid-core-m820.js','v5-splash-render-m802.js','v5-whitewater-optics-m820.js','v5-scenes-m830.js'];
      html=html.split('\n').filter(line=>!skipped.some(file=>line.includes(`await import('./src/${file}`))).join('\n');
      const pourImports=[
        " note.textContent='installing source runtime…';await import('./src/v5-faucet-open-boundary-m861.js');",
        " note.textContent='installing realism composite…';await import('./src/v5-realism-shader-m746.js');",
        " note.textContent='installing native-resolution water…';await import('./src/v5-faucet-material-m867.js');",
        " note.textContent='shaping the receiving glass…';await import('./src/v5-vessel-reference-m886.js?v=886');",
        " note.textContent='installing clean-catch boundary…';await import('./src/v5-vessel-capture-m888.js?pre=888nospill2');",
        " note.textContent='decoding bundled GLB jug locally…';await import('./src/v5-jug-model-m890.js?pre=890native2');",
        " note.textContent='warming measured GLB reservoir…';await import('./src/v5-proven-pour-m899.js?pre=8995');",
        " note.textContent='building GLB-profile PBF vessel…';await import('./src/v5-vessel-moving-boundary-m880.js?v=899shape2');",
        " note.textContent='restoring CFL energy guard…';await import('./src/v5-vessel-energy-guard-m881.js?v=881');",
        " note.textContent='finalizing no-spill capture…';await import('./src/v5-vessel-capture-m888.js?post=888nospill2');",
        " note.textContent='attaching local GLB renderer…';await import('./src/v5-jug-model-m890.js?post=890native2');",
        " note.textContent='arming manual gravity pour…';await import('./src/v5-proven-pour-m899.js?post=8995');",
        " await import('./src/v5-fps-hud-m852.js');",
        " await import('./src/v5-mobile-hud-m857.js');"
      ].join('\n');
      html=html.replace(sceneLine,sceneLine+'\n'+pourImports);
      html=html.replace("const scene=s?.active||'pool';","const scene=window.__v5M890?.modelReady?'local-glb-jug':(window.__v5M881EnergyGuard?.online?'energy-safe-moving-boundary':'pool');");
      html=html.replaceAll('M8.3','M8.9.9').replace("window.__fluidV5Version='8.9.9.0'","window.__fluidV5Version='8.9.9'").replace("window.__fluidV5Build='M8.9.9 FULL SCENARIO RESTORE / M8.2 COMMON WATER / ONE-SUBMIT CORE'","window.__fluidV5Build='M8.9.9 LOCAL GLB / MEASURED PBF CONTAINMENT / GRAVITY-ONLY POUR'");
    }else{
      boot.querySelector('small').textContent=`loading ${requested.toUpperCase()} · common PBF water · one GPU submission per frame…`;
      const r=await fetch('./m830.html?main=9005',{cache:'no-store'});if(!r.ok)throw new Error(`Fluid V8 scenario fetch failed: HTTP ${r.status}`);html=await r.text();
    }
    if(!html.includes('</body>'))throw new Error('Fluid V8 scenario shell is incomplete.');
    html=html.replace('</body>',dock+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){console.error('[Fluid Simulation Lab bootstrap]',err);boot.className='err';boot.textContent='FLUID SIMULATION LAB ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');}
})();
</script></body></html>
