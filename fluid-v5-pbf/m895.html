<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid V8 · M8.9.5 Clean GLB Pour</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5;max-width:84vw}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID V8 · M8.9.5</b><small>cleaning GLB body shell · restoring one hydrostatic reservoir · reducing wall beading · increasing real-jug drain angle…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch('./m892.html?m895base=1',{cache:'no-store'});if(!r.ok)throw new Error(`M8.9.2 base fetch failed: HTTP ${r.status}`);let html=await r.text();
    const pre=" note.textContent='deriving angle-aware GLB inner surface…';await import('./src/v5-jug-physics-m892.js?pre=892');";
    const post=" note.textContent='reporting GLB inner-surface fluid…';await import('./src/v5-jug-physics-m892.js?post=892');";
    if(!html.includes(pre)||!html.includes(post))throw new Error('M8.9.5 bootstrap could not locate M8.9.2 shell hooks.');
    // Both anchors live inside M8.9.2's quoted bootstrap string. Insert literal backslash-n
    // sequences so the nested JavaScript remains valid when document.write() executes it.
    html=html.replace(pre,pre+"\\n note.textContent='sanitizing GLB body-only collision shell…';await import('./src/v5-jug-shell-fix-m895.js?v=895');");
    html=html.replace(post,post+"\\n note.textContent='loading clean hydrostatic reservoir + full drain…';await import('./src/v5-jug-reservoir-m895.js?v=895');");
    html=html.replaceAll('M8.9.2','M8.9.5');
    document.open();document.write(html);document.close();
  }catch(err){console.error('[M8.9.5 bootstrap]',err);boot.className='err';boot.textContent='M8.9.5 BOOTSTRAP ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');}
})();
</script></body></html>
