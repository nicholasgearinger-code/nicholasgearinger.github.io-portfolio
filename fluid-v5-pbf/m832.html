<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid V8 · M8.3.2 WGSL Sweep</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID V8 · M8.3.2</b><small>loading full WGSL reserved-word compatibility sweep…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch('./m830.html?m832=1',{cache:'no-store'});
    if(!r.ok)throw new Error(`M8.3 base fetch failed: HTTP ${r.status}`);
    let html=await r.text();
    const needle="note.textContent='loading physical Wave Lab…';await import('./src/v5-wave-lab-m745.js');";
    if(!html.includes(needle))throw new Error('M8.3.2 bootstrap could not locate scenario import point.');
    const patched="note.textContent='installing full WGSL reserved-word compatibility…';await import('./src/v5-wgsl-ios-compat-m832.js');\n "+needle;
    html=html.replace(needle,patched)
      .replaceAll('M8.3','M8.3.2')
      .replace("window.__fluidV5Version='8.3.0'","window.__fluidV5Version='8.3.2'")
      .replace("window.__fluidV5Build='M8.3.2 FULL SCENARIO RESTORE / M8.2 COMMON WATER / ONE-SUBMIT CORE'","window.__fluidV5Build='M8.3.2 IOS WGSL RESERVED-WORD SWEEP / FULL SCENARIO RESTORE / M8.2 COMMON WATER / ONE-SUBMIT CORE'");
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('[M8.3.2 bootstrap]',err);boot.className='err';boot.textContent='M8.3.2 BOOTSTRAP ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');
  }
})();
</script></body></html>
