<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06131a">
<title>Fluid V4.4 · PBF Water</title>
<style>html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center}.status{padding:24px;text-align:center;color:#9fc1cf}.title{color:#86f6ff;font-weight:800;letter-spacing:.12em;margin-bottom:8px}</style>
</head>
<body>
<div class="status"><div class="title">FLUID V4.4 · PBF WATER</div>Loading realtime WebGPU fluid…</div>
<script>
(() => {
  // Keep the portfolio's long-lived fluid-sim-prototype.html route working while replacing
  // the legacy heightfield demo with the production V4.4 PBF build. When embedded in the
  // portfolio, also refresh the old card copy so visitors see what is actually running.
  try {
    if (window.parent && window.parent !== window) {
      const doc = window.parent.document;
      const viewport = doc.getElementById('fluidsim-viewport');
      if (viewport) {
        let node = viewport;
        let scope = null;
        for (let i = 0; i < 6 && node; i++, node = node.parentElement) {
          if (node.querySelector?.('.cc-filename') && node.querySelector?.('.algo-hint')) {
            scope = node;
            break;
          }
        }
        const filename = scope?.querySelector('.cc-filename') || doc.querySelector('#fluidsim-viewport')?.parentElement?.previousElementSibling?.querySelector?.('.cc-filename');
        if (filename) filename.textContent = 'fluid-v4-pbf · V4.4';
        const hint = scope?.querySelector('.algo-hint');
        if (hint) hint.textContent = 'Realtime WebGPU PBF water with interactive waves, refracted sunlight caustics, pool optics, volumetric light shafts, dispersion, scattering, wet waterline effects, foam and temporal accumulation. Tap or drag the water, drop the ball, and open Water Settings to experiment with the Realism Lab.';
      }
    }
  } catch (err) {
    console.warn('[Fluid V4.4 portfolio handoff] parent-card copy update skipped.', err);
  }
  location.replace('./fluid-v4-pbf/');
})();
</script>
<noscript><a href="./fluid-v4-pbf/" style="color:#86f6ff">Open Fluid V4.4</a></noscript>
</body>
</html>
