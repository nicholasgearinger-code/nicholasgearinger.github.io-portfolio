# Deploy the production site plus an isolated r185 migration preview.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "three-r185-migration"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Only the newest Pages build should publish. During rapid migration testing,
  # allowing every queued run to finish can redeploy an older/broken preview
  # after a newer hotfix has already been pushed.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always publish production from main, even when this workflow was triggered
      # by a migration-branch push.
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main

      # Put a complete copy of the CURRENT migration branch under /r185-build/.
      # With cancel-in-progress=true, stale queued deployments cannot overwrite
      # the latest known-good preview after a rapid sequence of test commits.
      - name: Checkout r185 migration preview
        uses: actions/checkout@v4
        with:
          ref: three-r185-migration
          path: .r185-preview-source

      - name: Stage r185 preview
        shell: bash
        run: |
          rm -rf r185-build
          mkdir -p r185-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .r185-preview-source/ r185-build/
          rm -rf .r185-preview-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
