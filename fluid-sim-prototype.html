<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06131b" />
<title>Hybrid WebGPU Fluid Lab</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(3, 15, 23, .72);
    --border: rgba(125, 211, 252, .25);
    --cyan: #70e3ef;
    --muted: #a8c6d2;
    --hot: #ffb35a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07151d; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  #fluid-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .card {
    border: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(8px);
    border-radius: 10px; padding: 9px 11px; color: #e9fbff; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .title { font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: .13em; text-transform: uppercase; color: var(--cyan); }
  .sub { margin-top: 5px; font-size: 10px; line-height: 1.35; color: var(--muted); max-width: 450px; }
  .stats { text-align: right; white-space: nowrap; }
  #fps { color: #a7f3d0; font-weight: 700; font-size: 13px; }
  #sim-state { margin-top: 3px; color: var(--cyan); font-size: 10px; }
  #quality-state { margin-top: 2px; color: var(--muted); font-size: 9px; }
  .bottom { display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; }
  #status { max-width: min(480px, 60vw); font-size: 9px; color: #b9d9e3; }
  #status.error { color: #ff9c9c; border-color: rgba(255,120,120,.45); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: auto; }
  button {
    appearance: none; border: 1px solid rgba(112,227,239,.32); border-radius: 999px;
    padding: 8px 10px; background: rgba(4,25,35,.82); color: #dffaff;
    font: 600 9px/1 ui-monospace, monospace; letter-spacing: .03em; cursor: pointer;
  }
  button:active { transform: translateY(1px); background: rgba(10,55,68,.9); }
  button.off { opacity: .55; }
  #drop-ball { border-color: rgba(255,179,90,.5); color: #ffd5a4; }
  @media (max-width: 680px) {
    .sub { display: none; }
    .card { padding: 7px 9px; backdrop-filter: none; }
    .controls { max-width: 68vw; }
    button { padding: 7px 8px; font-size: 8px; }
    #status { max-width: 30vw; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://esm.sh/@dimforge/rapier3d-compat@0.20.0"
  }
}
</script>
</head>
<body>
<canvas id="fluid-canvas"></canvas>
<div class="hud">
  <div class="top">
    <div class="card">
      <div class="title">Hybrid WebGPU Fluid Lab</div>
      <div class="sub">Heightfield + advected velocity + vorticity + Jacobi pressure projection + foam + transmissive spray + Rapier rigid bodies. Drag across the surface to inject momentum.</div>
    </div>
    <div class="card stats">
      <div id="fps">-- FPS</div>
      <div id="sim-state">STARTING</div>
      <div id="quality-state">--</div>
    </div>
  </div>
  <div class="bottom">
    <div id="status" class="card">Initializing…</div>
    <div class="controls">
      <button id="drop-ball" type="button">Drop sphere</button>
      <button id="drop-cube" type="button">Drop cube</button>
      <button id="splash" type="button">Splat</button>
      <button id="vorticity" type="button">Vorticity ON</button>
      <button id="pressure" type="button">Pressure</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>
</div>
<script type="module" src="./fluid-v2/RendererCompat.js"></script>
<script type="module" src="./fluid-v2/main.js"></script>
</body>
</html>
