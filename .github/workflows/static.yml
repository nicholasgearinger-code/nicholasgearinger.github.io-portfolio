# Deploy the production site plus isolated r185 migration/experiment previews.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "three-r185-migration", "shadow-v11-experiment", "rift-lighting-v20-experiment"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Only the newest Pages build should publish. During rapid renderer testing,
  # allowing every queued run to finish can redeploy an older preview after a
  # newer hotfix has already been pushed.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always publish production from main regardless of which preview branch
      # triggered this workflow.
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main

      # Stable r185 migration preview. Keep this frozen on the last known-good
      # build while renderer experiments are tested independently.
      - name: Checkout r185 migration preview
        uses: actions/checkout@v4
        with:
          ref: three-r185-migration
          path: .r185-preview-source

      - name: Stage r185 preview
        shell: bash
        run: |
          rm -rf r185-build
          mkdir -p r185-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .r185-preview-source/ r185-build/
          rm -rf .r185-preview-source

      # Legacy isolated shadow experiment.
      - name: Checkout shadow v11 experiment
        uses: actions/checkout@v4
        with:
          ref: shadow-v11-experiment
          path: .shadow-v11-preview-source

      - name: Stage shadow v11 experiment
        shell: bash
        run: |
          rm -rf shadow-v11-build
          mkdir -p shadow-v11-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .shadow-v11-preview-source/ shadow-v11-build/
          rm -rf .shadow-v11-preview-source

      # Rift Lighting 2.0: CSM + SSS + GTAO/SSGI + Model 2 cloud shadows.
      # Separate path means this experimental post/shadow stack cannot replace the
      # known-good r185 preview if WebGPU rejects one of the new passes.
      - name: Checkout Rift Lighting 2.0 experiment
        uses: actions/checkout@v4
        with:
          ref: rift-lighting-v20-experiment
          path: .lighting-v20-preview-source

      - name: Stage Rift Lighting 2.0 experiment
        shell: bash
        run: |
          rm -rf lighting-v20-build
          mkdir -p lighting-v20-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            .lighting-v20-preview-source/ lighting-v20-build/
          rm -rf .lighting-v20-preview-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
