<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rift Islands · Lighting 2 Test</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020913;color:#dff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
  </style>
</head>
<body>
  <div id="boot">Preparing Rift Lighting 2.0…</div>
  <script>
    (async () => {
      const response = await fetch('./index.html?rift-r185-bootstrap=1', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load index.html (${response.status})`);

      let html = await response.text();

      // Install r185.1 before any Rift module is parsed.
      html = html.replaceAll('three@0.182.0', 'three@0.185.1');

      // Keep the production launcher untouched; this preview alone uses the
      // isolated Lighting 2 launcher and runtime wrapper.
      const launcherNeedle = '<script type="module" src="rift/main.js"></' + 'script>';
      const launcherReplacement = '<script type="module" src="rift/main_lighting2.js"></' + 'script>';
      if (!html.includes(launcherNeedle)) throw new Error('Could not locate Rift module launcher');
      html = html.replace(launcherNeedle, launcherReplacement);

      const marker = '<scr' + 'ipt>' +
        'window.__riftR185StaticImportMap=true;window.__riftThreeTarget="0.185.1";window.__riftMigrationBuild="rift-lighting-2";' +
        '<' + '/scr' + 'ipt></head>';
      html = html.replace('</head>', marker);

      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      const boot = document.getElementById('boot');
      if (boot) boot.textContent = `Lighting 2 bootstrap failed: ${error?.message || error}`;
      console.error('[rift-lighting2-bootstrap]', error);
    });
  </script>
</body>
</html>
