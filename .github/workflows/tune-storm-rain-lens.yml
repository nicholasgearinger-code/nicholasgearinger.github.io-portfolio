name: Tune storm rain and lens

on:
  push:
    branches:
      - tune/storm-rain-lens

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tune/storm-rain-lens
          fetch-depth: 0

      - name: Apply targeted tuning
        shell: python
        run: |
          from pathlib import Path

          path = Path("rift/main_game.js")
          text = path.read_text()

          replacements = [
              (
                  'const RAIN_PARTICLE_COUNT = Math.round(3000 * getGraphicsSettings().particleMultiplier);',
                  'const RAIN_PARTICLE_COUNT = Math.min(9000, Math.round(5200 * getGraphicsSettings().particleMultiplier));',
              ),
              ('const RAIN_RADIUS = 55; // spawn XZ scatter radius around the camera', 'const RAIN_RADIUS = 42; // tighter camera-local storm volume: denser rain without an excessive particle count'),
              ('const RAIN_FALL_SPEED = 22; // world units/sec — fast, driving rain, not a gentle drizzle', 'const RAIN_FALL_SPEED = 28; // harder squall: faster, more driving rain'),
              ('material.scaleNode = vec2(0.025, 0.55);', 'material.scaleNode = vec2(0.018, 0.46);'),
              ('handle.rainOpacity.value = isUnderwater ? 0 : clampNum(rainIntensity, 0, 1) * 0.6;', 'handle.rainOpacity.value = isUnderwater ? 0 : clampNum(rainIntensity, 0, 1) * 0.46;'),
              ('const ROWS_PER_LANE = 4;', 'const ROWS_PER_LANE = 3;'),
              ('const coverageThreshold = mix(float(0.95), float(0.05), lensIntensityUniform);', 'const coverageThreshold = mix(float(0.98), float(0.36), lensIntensityUniform);'),
              ('const dropletPresent = smoothstep(coverageThreshold, coverageThreshold.add(0.02), hash(seed.add(71.0)));', 'const dropletPresent = smoothstep(coverageThreshold, coverageThreshold.add(0.035), hash(seed.add(71.0)));'),
              ('const dropletRadius = mix(float(0.09), float(0.48), pow(sizeRand, float(1.5)));', 'const dropletRadius = mix(float(0.055), float(0.28), pow(sizeRand, float(1.65)));'),
              ('const wiggleAmount = mix(float(0.06), float(0.16), hash(seed.add(151.0))).mul(dropletRadius.div(0.22));', 'const wiggleAmount = mix(float(0.045), float(0.10), hash(seed.add(151.0))).mul(dropletRadius.div(0.17));'),
              ('const sizeFactor = dropletRadius.div(0.22);', 'const sizeFactor = dropletRadius.div(0.17);'),
              ('const distortAmount = inDroplet.mul(dropletPresent).mul(0.06).mul(sizeFactor).mul(lensIntensityUniform);', 'const distortAmount = inDroplet.mul(dropletPresent).mul(0.024).mul(sizeFactor).mul(lensIntensityUniform);'),
              ('const trailWidthNear = dropletRadius.mul(0.8);', 'const trailWidthNear = dropletRadius.mul(0.58);'),
              ('const trailWidthFar = dropletRadius.mul(0.22);', 'const trailWidthFar = dropletRadius.mul(0.13);'),
              ('const trailWidth = trailWidthTapered.mul(mix(float(0.65), float(1.35), bulgeNoise));', 'const trailWidth = trailWidthTapered.mul(mix(float(0.75), float(1.18), bulgeNoise));'),
              ('const trailDistort = trailMask.mul(0.015).mul(sizeFactor).mul(lensIntensityUniform);', 'const trailDistort = trailMask.mul(0.006).mul(sizeFactor).mul(lensIntensityUniform);'),
              ('const lit = mix(float(0.3), one, sunProximity);', 'const lit = mix(float(0.16), one, sunProximity);'),
              ('const fresnelRim = smoothstep(float(0.7), float(1.0), rimT).mul(gated).mul(0.16).mul(lit);', 'const fresnelRim = smoothstep(float(0.7), float(1.0), rimT).mul(gated).mul(0.085).mul(lit);'),
              ('const sunLitGlow = sunProximity.mul(gated).mul(0.35);', 'const sunLitGlow = sunProximity.mul(gated).mul(0.14);'),
              ('lightBoost = lightBoost.add(highlight.mul(0.22)).add(fresnelRim).add(sunLitGlow).add(trailMask.mul(0.06).mul(one.add(sunProximity.mul(0.8))));', 'lightBoost = lightBoost.add(highlight.mul(0.12)).add(fresnelRim).add(sunLitGlow).add(trailMask.mul(0.025).mul(one.add(sunProximity.mul(0.8))));'),
              ('const finalColor = sceneColor.rgb.add(vec3(lightBoost.mul(lensIntensityUniform))).add(sunGlintColor.mul(0.9).mul(lensIntensityUniform));', 'const finalColor = sceneColor.rgb.add(vec3(lightBoost.mul(lensIntensityUniform))).add(sunGlintColor.mul(0.35).mul(lensIntensityUniform));'),
              ('weatherHandle.rainIntensity = Math.min(1, weatherHandle.rainIntensity + dt * 2);', 'weatherHandle.rainIntensity = Math.min(1, weatherHandle.rainIntensity + dt * 0.2);'),
              ('lensRainWetness = Math.min(rainTarget, lensRainWetness + dt / 3);', 'lensRainWetness = Math.min(rainTarget, lensRainWetness + dt / 14);'),
              ('lensRainWetness = Math.max(rainTarget, lensRainWetness - dt / 35);', 'lensRainWetness = Math.max(rainTarget, lensRainWetness - dt / 40);'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Syntax check
        run: node --check rift/main_game.js

      - name: Commit tuned game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rift/main_game.js
          git diff --cached --check
          git commit -m "Tune storm rain and lens clarity"
          git push origin HEAD:tune/storm-rain-lens
