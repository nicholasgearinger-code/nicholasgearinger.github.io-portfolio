<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid V8 · M8.4.1 Packed Flow</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID V8 · M8.4.1</b><small>loading packed physical flow boundaries…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch('./m830.html?m841=1',{cache:'no-store'});
    if(!r.ok)throw new Error(`M8.3 base fetch failed: HTTP ${r.status}`);
    let html=await r.text();
    const waveNeedle="note.textContent='loading physical Wave Lab…';await import('./src/v5-wave-lab-m745.js');";
    const sceneNeedle="note.textContent='installing M8.3 scenario compatibility layer…';await import('./src/v5-scenes-m830.js');";
    if(!html.includes(waveNeedle)||!html.includes(sceneNeedle))throw new Error('M8.4.1 bootstrap could not locate import points.');
    html=html.replace(waveNeedle,"note.textContent='installing iOS/WebKit WGSL compatibility…';await import('./src/v5-wgsl-ios-compat-m832.js');\n "+waveNeedle);
    html=html.replace(sceneNeedle,sceneNeedle+"\n note.textContent='installing M8.4.1 packed physical flow boundaries…';await import('./src/v5-flow-boundaries-m841.js');");
    html=html.replace("const scene=s?.active||'pool';","const scene=window.__v5M841Flow?.active||s?.active||'pool';");
    html=html.replaceAll('M8.3','M8.4.1')
      .replace("window.__fluidV5Version='8.3.0'","window.__fluidV5Version='8.4.1'")
      .replace("window.__fluidV5Build='M8.4.1 FULL SCENARIO RESTORE / M8.2 COMMON WATER / ONE-SUBMIT CORE'","window.__fluidV5Build='M8.4.1 PACKED PHYSICAL FLOW BOUNDARIES / M8.2 COMMON WATER / ONE-SUBMIT CORE'");
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('[M8.4.1 bootstrap]',err);boot.className='err';boot.textContent='M8.4.1 BOOTSTRAP ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');
  }
})();
</script></body></html>
