<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06131a"><title>Fluid V8 · M8.9.3 GLB-Shell Water Fill</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:30px;text-align:center}#boot b{color:#86f6ff;letter-spacing:.12em}#boot small{color:#8ba7b2;line-height:1.5;max-width:84vw}#boot.err{color:#ff9f9f;white-space:pre-wrap;text-align:left}</style></head><body><div id="boot"><b>FLUID V8 · M8.9.3</b><small>loading original GLB material · inner-normal collision shell · packing the PBF simulation directly inside the jug volume…</small></div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch('./m892.html?m893base=2',{cache:'no-store'});if(!r.ok)throw new Error(`M8.9.2 base fetch failed: HTTP ${r.status}`);let html=await r.text();
    const anchor=" note.textContent='reporting GLB inner-surface fluid…';await import('./src/v5-jug-physics-m892.js?post=892');";
    if(!html.includes(anchor))throw new Error('M8.9.3 bootstrap could not locate M8.9.2 post-shell import.');
    // m892.html contains this import inside a quoted bootstrap string. Insert a literal
    // backslash-n sequence, not a real newline, so the nested JavaScript remains valid.
    html=html.replace(anchor,anchor+"\\n note.textContent='packing PBF water into GLB shell…';await import('./src/v5-jug-fill-m893.js?v=893fix1');");
    html=html.replaceAll('M8.9.2','M8.9.3');
    document.open();document.write(html);document.close();
  }catch(err){console.error('[M8.9.3 bootstrap]',err);boot.className='err';boot.textContent='M8.9.3 BOOTSTRAP ERROR\n\n'+String(err?.message||err)+'\n\n'+String(err?.stack||'');}
})();
</script></body></html>
