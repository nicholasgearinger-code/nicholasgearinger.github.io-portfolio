<title>Fluid V4 — Interactive PBF Reference</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131a;color:#dffcff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07131a}
#bar{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.card{background:rgba(3,17,24,.84);border:1px solid rgba(124,231,239,.32);border-radius:12px;padding:9px 11px;backdrop-filter:blur(8px);font-size:11px;line-height:1.38;max-width:68vw}
.card b{color:#8cf8ff;letter-spacing:.06em}
a{pointer-events:auto;color:#dffcff;text-decoration:none;background:rgba(3,17,24,.92);border:1px solid rgba(124,231,239,.48);border-radius:999px;padding:10px 13px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<iframe id="pbf" allow="fullscreen" referrerpolicy="no-referrer" src="https://particles4all.netlify.app/?preset=small&view=ssfr&bodies=1&body=sphere:0.45:0.76,sphere:0.85:0.86&bodysize=0.11&grab=1&grabstrength=21&flimit=6&particles=30000&substeps=2&iters=4&xsph=0.03&scorr=0.08&tension=0.25&ssfrscale=0.5"></iframe>
<div id="bar">

</div>
